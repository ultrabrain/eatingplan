<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Food Log</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c5cab" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food Log">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f9f9f7; --raised:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --blue:#2a78d6; --blue-d:#1c5cab; --blue-l:#86b6ef;
  --aqua:#1baf7a; --orange:#eb6834; --violet:#4a3aa7;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d; --raised:#232322;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --blue:#3987e5; --blue-d:#5598e7; --blue-l:#184f95;
    --aqua:#199e70; --orange:#d95926; --violet:#9085e9;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(68px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 24px;
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
h1{font-size:20px;margin:0;letter-spacing:-0.02em}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-0.01em}
h3{font-size:13px;margin:18px 0 7px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);font-weight:650}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:15px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:11.5px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;background:var(--raised);color:var(--ink);
  border:1px solid var(--ring);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{background:var(--blue);color:#fff;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14.5px;text-align:center;display:inline-block}
.btn.ghost{background:var(--raised);color:var(--ink);border:1px solid var(--ring)}
.btn.danger{background:var(--crit)}
.btn.full{display:block;width:100%}
.btn:active{opacity:.75}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--page);
  padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--grid)}
.hd{max-width:640px;margin:0 auto;padding:8px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:17px}
.datenav button:active{background:var(--grid)}
.dlab{font-size:13.5px;font-weight:600;min-width:82px;text-align:center}

/* meters */
.meter{margin:13px 0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px}
.meter .nm{font-weight:600}
.meter .vals{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px}
.meter .track{height:9px;background:var(--grid);border-radius:5px;overflow:hidden;position:relative}
.meter .fill{height:100%;border-radius:5px;transition:width .3s ease}
.meter .why{font-size:11.5px;color:var(--muted);margin-top:3px}
.pct{font-weight:700;font-variant-numeric:tabular-nums}

/* dish list */
.search{margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;padding:6px 12px;border-radius:18px;background:var(--raised);border:1px solid var(--ring);color:var(--ink2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.dish{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--grid);width:100%;text-align:left}
.dish:last-child{border-bottom:0}
.dish:active{background:var(--grid)}
.dish .info{flex:1;min-width:0}
.dish .nm{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dish .add{flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;line-height:1;font-weight:400}
.flag{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}

/* logged entries */
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.entry:last-child{border-bottom:0}
.entry .t{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px;flex:none}
.entry .e-nm{flex:1;font-size:14px;min-width:0}
.entry .e-nm small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.entry .del{color:var(--muted);padding:6px 4px;font-size:16px}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--ring)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--grid);padding-bottom:env(safe-area-inset-bottom)}
.nv{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nv button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600}
.nv button.on{color:var(--blue)}
.nv .ic{font-size:19px;line-height:1}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;max-width:640px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--axis);border-radius:2px;margin:0 auto 14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.qty{display:flex;gap:8px}
.qty button{flex:1;padding:9px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:13.5px;font-weight:600}
.qty button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* misc */
.pill{font-size:11px;font-weight:650;padding:2px 7px;border-radius:12px;white-space:nowrap}
.pill.ok{background:rgba(12,163,12,.14);color:#0a7a0a}
.pill.warn{background:rgba(250,178,25,.2);color:#8a5c00}
.pill.bad{background:rgba(208,59,59,.14);color:#a12b2b}
@media(prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .pill.ok{color:#0ca30c}
 :root:where(:not([data-theme="light"])) .pill.warn{color:#fab219}
 :root:where(:not([data-theme="light"])) .pill.bad{color:#e66767}}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin:10px 0 4px}
.bars .b{flex:1;background:var(--blue-l);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b.over{background:var(--crit)}
.blabs{display:flex;gap:3px;font-size:9.5px;color:var(--muted);text-align:center}
.blabs span{flex:1}
.hint{background:rgba(42,120,214,.07);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;margin:10px 0}
.hint.bad{background:rgba(208,59,59,.06);border-color:var(--crit)}
.hint.good{background:rgba(12,163,12,.06);border-color:var(--good)}
.hint b{font-weight:650}
hr{border:0;border-top:1px solid var(--grid);margin:16px 0}
.swaprow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.swaprow:last-child{border-bottom:0}
.swaprow .ar{color:var(--muted);flex:none}
.swaprow .sv{margin-left:auto;font-size:12px;font-weight:650;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ring);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* camera hero */
.shoot{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--blue);color:#fff;border-radius:15px;padding:16px 17px;margin-bottom:12px;
  box-shadow:0 2px 10px rgba(42,120,214,.28)}
.shoot:active{transform:scale(.985)}
.shoot.setup{background:var(--surface);color:var(--ink);border:1.5px dashed var(--blue);box-shadow:none}
.shoot.setup .cico{color:var(--blue)}
.shoot.setup small{opacity:1;color:var(--ink2)}
#gear{font-size:16px}
.shoot .cico{font-size:26px;line-height:1;flex:none}
.shoot b{display:block;font-size:15.5px;font-weight:650}
.shoot small{display:block;font-size:12px;opacity:.9;margin-top:2px;line-height:1.35}

/* grouped meter cards */
.ghead{display:flex;flex-direction:column;gap:1px;margin-bottom:4px;padding-bottom:9px;border-bottom:1px solid var(--grid)}
.gn{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.gs{font-size:11.5px;color:var(--muted)}
.card.secondary{background:transparent;border-style:dashed}
.card.secondary .gn{color:var(--muted)}
.card.secondary .meter .nm{font-weight:500;color:var(--ink2)}
.meter.hero .nm{font-size:16px}
.meter.hero .pct{font-size:17px}
.meter.hero .track{height:12px}

/* result flash */
.flash{border-radius:13px;padding:14px 15px;margin-bottom:12px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.flash.ok{background:rgba(12,163,12,.1);border:1px solid rgba(12,163,12,.3)}
.flash.warn{background:rgba(208,59,59,.08);border:1px solid rgba(208,59,59,.3)}
.flash .fh{font-weight:650;font-size:15px;margin-bottom:3px}
.flash .fs{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.flash .fa{display:flex;gap:8px;margin-top:10px}
.flash .fa button{flex:1;padding:8px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:13px;font-weight:600}
.fr{display:flex;gap:11px;align-items:flex-start}
.fimg{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--ring);cursor:pointer}
.fimg.dim{opacity:.4;filter:grayscale(1)}
.pq{margin-top:11px;padding-top:10px;border-top:1px solid var(--ring)}
.pql{font-size:12px;font-weight:650;color:var(--ink2);display:block;margin-bottom:7px}
.pqr{display:flex;gap:5px}
.pqr button{flex:1;padding:8px 2px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:12.5px;font-weight:600}
.pqr button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.conf{font-size:11px;font-weight:650;padding:2px 7px;border-radius:11px;background:var(--grid);color:var(--ink2);margin-left:6px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1 id="title">Today</h1><span id="bld" class="tiny" style="margin-left:-4px;align-self:flex-end;padding-bottom:3px"></span>
    <div class="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <span class="dlab" id="dlab">—</span>
      <button id="next" aria-label="Next day">›</button>
      <button id="gear" aria-label="Settings" title="Settings" style="margin-left:2px">⚙</button>
    </div>
  </div>
</header>

<div class="wrap" id="view"></div>

<nav><div class="nv">
  <button data-tab="today" class="on"><span class="ic">◍</span>Today</button>
  <button data-tab="add"><span class="ic">+</span>Log food</button>
  <button data-tab="trends"><span class="ic">◫</span>Trends</button>
  <button data-tab="health"><span class="ic">♡</span>Health</button>
</div></nav>

<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"></div>

function mealOf(ts){
  const h=new Date(ts).getHours();
  return h<11?'Breakfast':h<16?'Lunch':h<22?'Dinner':'Late snack';
}

/* Photos moved out of localStorage. At ~100KB each the 5MB cap would hold
   about 50 pictures; IndexedDB holds thousands. Two sizes per meal: a small
   thumb kept in memory for instant list rendering, and the full image loaded
   only when you tap to view it. */
const IDB={
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{
    const r=indexedDB.open('foodlog',1);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); };
    r.onerror=()=>rej(r.error);
  });},
  async tx(mode){ const d=await this.open(); return d.transaction('photos',mode).objectStore('photos'); },
  async put(id,rec){ const s=await this.tx('readwrite'); return new Promise((res,rej)=>{ const q=s.put(rec,id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); },
  async get(id){ const s=await this.tx('readonly'); return new Promise((res)=>{ const q=s.get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  async del(id){ const s=await this.tx('readwrite'); return new Promise((res)=>{ const q=s.delete(id); q.onsuccess=()=>res(); q.onerror=()=>res(); }); },
  async entries(){ const s=await this.tx('readonly'); return new Promise((res)=>{
    const out={}; const q=s.openCursor();
    q.onsuccess=()=>{ const c=q.result; if(!c){ res(out); return; } out[c.key]=c.value; c.continue(); };
    q.onerror=()=>res(out); });},
  async clear(){ const s=await this.tx('readwrite'); return new Promise(res=>{ const q=s.clear(); q.onsuccess=()=>res(); q.onerror=()=>res(); }); }
};

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw) { const p = JSON.parse(raw); return Object.assign(blank(), p); }
  }catch(e){ console.warn('load failed', e); }
  const b = blank();
  // Seed the two flares already on record, so the history starts complete.
  b.flares = [
    {id:'seed1', date:'2026-03-19', joint:'', days:0, notes:'On record before this app — details unknown'},
    {id:'seed2', date:'2026-08-11', joint:'', days:0, notes:'Followed a hard 30 km run'}
  ];
  b.weights = [{id:'seedw', date:'2026-08-05', kg:80.6, ctx:'normal', km:0}];
  return b;
}
function blank(){ return {logs:[], flares:[], weights:[], headaches:[], targets:{...DEFAULT_TARGETS},
  apiKey:'', recent:[], ghToken:'', gistId:'', gistUrl:'', lastBackup:0, lastPhotoBackup:0, backupErr:'',
  photoKB:100, backupPhotoDays:0}; }
function save(quiet){
  const ok=saveLocal();
  if(!quiet && S.ghToken) scheduleBackup();
  return ok;
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); return true; }
  catch(e){
    // Out of space. Shed the oldest photos — the numbers matter, the pictures don't.
    const withPhotos=S.logs.filter(l=>l.photo).sort((a,b)=>a.ts-b.ts);
    let dropped=0;
    for(const l of withPhotos){
      delete l.photo; dropped++;
      try{ localStorage.setItem(LS, JSON.stringify(S));
        alert(`Storage was full, so ${dropped} old photo${dropped===1?'':'s'} ${dropped===1?'was':'were'} removed. All your numbers are intact.`);
        return true; }catch(e2){}
    }
    alert('Storage is full and could not be freed. Export your data from Settings, then clear photos.');
    return false;
  }
}
function storageKB(){ try{ return Math.round((localStorage.getItem(LS)||'').length/1024); }catch(e){ return 0; } }
function photoCount(){ return Object.keys(THUMBS).length; }
async function clearPhotos(){
  const n=photoCount();
  if(!n){ alert('No photos stored.'); return; }
  if(!confirm(`Remove all ${n} stored photo${n===1?'':'s'}? Every meal entry and all your numbers stay.`)) return;
  await IDB.clear(); THUMBS={}; S.logs.forEach(l=>{ l.hasPhoto=false; }); save(); render();
}

function todayKey(d){ const x = d||new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function shiftKey(k,n){ const [y,m,d]=k.split('-').map(Number); const dt=new Date(y,m-1,d+n); return todayKey(dt); }
function prettyDate(k){
  if(k===todayKey()) return 'Today';
  if(k===shiftKey(todayKey(),-1)) return 'Yesterday';
  const [y,m,d]=k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function logsFor(k){ return S.logs.filter(l=>l.date===k); }
function totals(k){
  const t={kcal:0,sat:0,na:0,sug:0,pur:0};
  for(const l of logsFor(k)) for(const m in t) t[m]+= (l[m]||0)*(l.qty||1);
  return t;
}
function fmt(v,k){ if(k==='na'||k==='kcal') return Math.round(v); return Math.round(v*10)/10; }
function statusOf(pct){ return pct>100?'bad':pct>=80?'warn':'ok'; }
function barColor(pct){ return pct>100?'var(--crit)':pct>=80?'var(--warn)':'var(--blue)'; }

const view = document.getElementById('view');

function render(){

  const titles={today:'Food log',add:'Log food',trends:'Trends',health:'Health'};
  document.getElementById('title').textContent = titles[tab];
  const dn=(tab==='today'||tab==='add');
  ['prev','dlab','next'].forEach(id=>{const e=document.getElementById(id); if(e) e.style.display=dn?'':'none';});
  ({today:renderToday, add:renderAdd, trends:renderTrends, health:renderHealth})[tab]();
  window.scrollTo(0,0);
}

function meterHTML(m,val,tgt){
  const pct = tgt? (val/tgt*100) : 0;
  const over = val - tgt;
  return `<div class="meter${m.hero?' hero':''}">
    <div class="top">
      <span class="nm">${m.n}</span>
      <span class="vals"><span class="pct" style="color:${pct>100?'var(--crit)':pct>=80?'#8a5c00':'var(--ink)'}">${Math.round(pct)}%</span>
        &nbsp;${fmt(val,m.k)}${m.u} / ${tgt}${m.u}</span>
    </div>
    <div class="track"><div class="fill" style="width:${Math.min(100,pct)}%;background:${barColor(pct)}"></div></div>
    <div class="why">${pct>100? `<b style="color:var(--crit)">Over by ${fmt(over,m.k)}${m.u}.</b> ` : ''}${m.why}</div>
  </div>`;
}

function renderToday(){
  const t = totals(cur), tg = S.targets, ls = logsFor(cur);
  let h = '';

  // camera is the primary action — and routes to setup if it can't work yet
  if(cur===todayKey()){
    h += S.apiKey
      ? `<button class="shoot" onclick="document.getElementById('cam').click()">
          <span class="cico">◉</span><span><b>Take a photo of your meal</b>
          <small>Logged automatically — it only asks if it's unsure</small></span></button>`
      : `<button class="shoot setup" onclick="openKey()">
          <span class="cico">⚙</span><span><b>Set up the camera — 2 minutes</b>
          <small>Add an API key once and photos log themselves. Tap here.</small></span></button>
         <button class="btn ghost full" style="margin-bottom:12px" onclick="document.getElementById('cam').click()">Take a photo anyway (you fill in the numbers)</button>`;
    h += `<input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)">
      <div id="flash"></div>`;
  }

  for(const g of ['heart','metab','gout']){
    const ms = METRICS.filter(m=>m.grp===g);
    h += `<div class="card ${g==='gout'?'secondary':''}">
      <div class="ghead"><span class="gn">${GRP[g].n}</span><span class="gs">${GRP[g].sub}</span></div>
      ${ms.map(m=>meterHTML(m,t[m.k],tg[m.k])).join('')}</div>`;
  }

  // insight
  const W={heart:1.4, metab:1.0, gout:0.55};   // weight the warning by what actually threatens him
  const worst = METRICS.map(m=>({m,pct:t[m.k]/tg[m.k]*100,w:(t[m.k]/tg[m.k]*100)*W[m.grp]}))
                       .sort((a,b)=>b.w-a.w)[0];
  if(ls.length){
    if(worst.pct>100){
      const top = ls.map(l=>({n:l.name,v:(l[worst.m.k]||0)*(l.qty||1)})).sort((a,b)=>b.v-a.v)[0];
      h += `<div class="hint bad"><b>${worst.m.n} is over budget.</b> Biggest contributor: ${top.n} at ${fmt(top.v,worst.m.k)}${worst.m.u}.
        ${swapHint(ls)}</div>`;
    } else if(worst.pct<70){
      h += `<div class="hint good"><b>Comfortably inside every budget.</b> Nothing to change today.</div>`;
    } else {
      h += `<div class="hint"><b>${worst.m.n}</b> is your tightest at ${Math.round(worst.pct)}%. ${fmt(tg[worst.m.k]-t[worst.m.k],worst.m.k)}${worst.m.u} left.</div>`;
    }
  }

  h += `<div class="card"><div class="row sp" style="margin-bottom:6px">
      <h2 style="margin:0">Logged</h2><span class="tiny">${ls.length} item${ls.length===1?'':'s'}</span></div>`;
  if(!ls.length) h += `<div class="empty">Nothing logged yet.<br><br><button class="btn ghost" onclick="go('add')">Pick from the list instead</button></div>`;
  else {
    const byMeal={};
    for(const l of ls) (byMeal[l.meal||mealOf(l.ts)] ||= []).push(l);
    for(const meal of MEAL_ORDER){
      const items=byMeal[meal]; if(!items||!items.length) continue;
      const msat=items.reduce((s,l)=>s+l.sat*(l.qty||1),0);
      h += `<h3 style="margin:16px 0 2px">${meal} <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${fmt(msat)}g sat fat</span></h3>`;
      h += items.sort((a,b)=>a.ts-b.ts).map(l=>`
        <div class="entry">
          <span class="t">${new Date(l.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
          ${THUMBS[l.id]?`<img class="thumb" src="${THUMBS[l.id]}" alt="" onclick="viewPhoto('${l.id}')" style="cursor:pointer">`:''}
          <span class="e-nm">${l.name}${(l.qty||1)!==1?` <span class="tiny">×${l.qty}</span>`:''}
            ${l.frac!=null&&l.frac!==1?`<span class="pill warn" style="margin-left:5px">${(PORTIONS.find(p=>p[0]===l.frac)||[,''])[1]}</span>`:''}
            ${l.auto?'<span class="pill ok" style="margin-left:5px">AI</span>':''}
            <small>${Math.round(l.kcal*(l.qty||1))} kcal · <b>${fmt(l.sat*(l.qty||1))}g sat</b> · ${Math.round(l.na*(l.qty||1))}mg Na</small></span>
          <button class="del" onclick="editLog('${l.id}')" aria-label="Edit">✎</button>
          <button class="del" onclick="delLog('${l.id}')" aria-label="Delete">×</button>
        </div>`).join('');
    }
    h += `<button class="btn ghost full" style="margin-top:14px" onclick="go('add')">Add from the list</button>`;
  }
  h += `</div>`;
  view.innerHTML = h;
}

function swapHint(ls){
  for(const l of ls){
    const s = SWAPS.find(x=>x[0]===l.dishId);
    if(s){ const from=DB.find(d=>d.id===s[0]), to=DB.find(d=>d.id===s[1]);
      const saveNa=from.na-to.na, saveSat=from.sat-to.sat, savePur=from.pur-to.pur;
      const saveSug=from.sug-to.sug;
      const bits=[]; if(saveNa>100)bits.push(`${Math.round(saveNa)}mg sodium`);
      if(saveSat>1)bits.push(`${fmt(saveSat)}g sat fat`);
      if(saveSug>3)bits.push(`${fmt(saveSug)}g sugar`);
      if(savePur>40)bits.push(`${Math.round(savePur)}mg purine`);
      if(bits.length) return `Next time: <b>${s[2]}</b> — saves ${bits.join(', ')}.`;
    }
  }
  return '';
}

function renderDishList(){
  const el = document.getElementById('dishlist'); if(!el) return;
  const tg=S.targets;
  let list = DB.filter(d=> (filter==='all'||d.g===filter) && (!q || d.n.toLowerCase().includes(q.toLowerCase())));
  if(filter==='all' && !q && S.recent.length){
    const rec = S.recent.map(id=>DB.find(d=>d.id===id)).filter(Boolean);
    list = [...rec, ...list.filter(d=>!S.recent.includes(d.id))];
  }
  if(!list.length){ el.innerHTML=`<div class="empty">No match.<br><br><button class="btn ghost" onclick="openCustom()">Add it manually</button></div>`; return; }
  el.innerHTML = list.map(d=>{
    const worst = Math.max(d.sat/tg.sat, d.na/tg.na, d.pur/tg.pur, d.sug/tg.sug)*100;
    const c = worst>60?'var(--crit)':worst>=35?'var(--warn)':'var(--good)';
    return `<button class="dish" onclick="openLog('${d.id}')">
      <span class="flag" style="background:${c}"></span>
      <span class="info"><span class="nm">${d.n}</span>
        <span class="sub">${d.kcal} kcal · ${fmt(d.sat)}g sat · ${d.na}mg Na · ${d.pur}mg pur</span></span>
      <span class="add">+</span></button>`;
  }).join('') + `<button class="btn ghost full" style="margin-top:12px" onclick="openCustom()">Something else</button>`;
}

function renderTrends(){
  const days=[...Array(14)].map((_,i)=>shiftKey(todayKey(),-13+i));
  const tg=S.targets;
  let h='';
  for(const m of METRICS){
    const vals = days.map(d=>totals(d)[m.k]);
    const max = Math.max(tg[m.k]*1.25, ...vals) || 1;
    const logged = days.filter(d=>logsFor(d).length);
    const avg = logged.length? logged.reduce((s,d)=>s+totals(d)[m.k],0)/logged.length : 0;
    const overDays = logged.filter(d=>totals(d)[m.k]>tg[m.k]).length;
    h += `<div class="card">
      <div class="row sp"><h2 style="margin:0">${m.n}</h2>
        <span class="pill ${avg>tg[m.k]?'bad':avg>tg[m.k]*0.8?'warn':'ok'}">avg ${fmt(avg,m.k)}${m.u}</span></div>
      <div class="tiny">${logged.length? `Over budget on ${overDays} of ${logged.length} logged days` : 'No data yet'}</div>
      <div class="bars">${days.map((d,i)=>{
        const v=vals[i], has=logsFor(d).length>0;
        return `<div class="b ${v>tg[m.k]?'over':''}" style="height:${has?Math.max(2,v/max*100):2}%;opacity:${has?1:.25}" title="${prettyDate(d)}: ${fmt(v,m.k)}${m.u}"></div>`;
      }).join('')}</div>
      <div class="blabs">${days.map((d,i)=>`<span>${i%3===0? d.slice(8):''}</span>`).join('')}</div>
      <div class="tiny" style="margin-top:6px">Target ${tg[m.k]}${m.u}/day · last 14 days</div>
    </div>`;
  }

  // biggest contributors over 14 days
  const recent = S.logs.filter(l=>days.includes(l.date));
  if(recent.length){
    const by={};
    for(const l of recent){ const k=l.name; by[k]=by[k]||{n:k,c:0,sat:0,na:0,pur:0,sug:0,kcal:0};
      by[k].c++; for(const m of ['sat','na','pur','sug','kcal']) by[k][m]+=(l[m]||0)*(l.qty||1); }
    const arr=Object.values(by);
    h += `<div class="card"><h2>What's using your budget</h2>
      <p class="tiny" style="margin:-4px 0 10px">Totals across the last 14 days</p>`;
    for(const m of ['sat','na','pur','sug']){
      const met=METRICS.find(x=>x.k===m);
      const top=arr.slice().sort((a,b)=>b[m]-a[m]).slice(0,3).filter(x=>x[m]>0);
      if(!top.length) continue;
      h+=`<h3 style="margin-top:14px">${met.n}</h3>`;
      h+=top.map(x=>`<div class="swaprow"><span>${x.n} <span class="tiny">×${x.c}</span></span>
        <span class="sv" style="color:var(--ink2)">${fmt(x[m],m)}${met.u}</span></div>`).join('');
    }
    h+=`</div>`;
  }
  view.innerHTML = h || `<div class="empty">Log a few meals and trends will appear here.</div>`;
}

function renderHealth(){

function foodBefore(date){
  const d1=shiftKey(date,-1), d2=shiftKey(date,-2);
  const ls=[...logsFor(d2),...logsFor(d1)];
  if(!ls.length) return '';
  const pur=ls.reduce((s,l)=>s+(l.pur||0)*(l.qty||1),0);
  const top=ls.slice().sort((a,b)=>(b.pur*(b.qty||1))-(a.pur*(a.qty||1))).slice(0,2).map(l=>l.name);
  return `<small style="color:var(--ink2)">48h before: ${Math.round(pur)}mg purine${top.length?` — mostly ${top.join(', ')}`:''}</small>`;
}

/* The AI can tell what a dish is. It cannot know how much of it you ate.
   So it reports the whole portion in frame, and you set the fraction. */
const PORTIONS=[[1,'All'],[0.75,'¾'],[0.5,'Half'],[0.25,'¼'],[0.125,'A taste']];
function setPortion(id,f){
  const l=S.logs.find(x=>x.id===id); if(!l) return;
  const b=l.base||{kcal:l.kcal,sat:l.sat,na:l.na,sug:l.sug,pur:l.pur};
  l.base=b; l.frac=f;
  l.kcal=Math.round(b.kcal*f); l.sat=+(b.sat*f).toFixed(1);
  l.na=Math.round(b.na*f); l.sug=+(b.sug*f).toFixed(1); l.pur=Math.round(b.pur*f);
  save(); render(); showFlash(flashFor(id));
}
function flashFor(id){
  const l=S.logs.find(x=>x.id===id); if(!l) return '';
  const tg=S.targets, satPct=Math.round(l.sat/tg.sat*100), naPct=Math.round(l.na/tg.na*100);
  const f=l.frac==null?1:l.frac;
  return `<div class="flash ${satPct>50||naPct>60?'warn':'ok'}">
    <div class="fr">${THUMBS[id]?`<img class="fimg" src="${THUMBS[id]}" alt="" onclick="viewPhoto('${id}')">`:''}
      <div style="flex:1;min-width:0">
        <div class="fh">Logged — ${l.name} <span class="tiny" style="font-weight:400">(${l.meal||''})</span></div>
        ${l.seen?`<div class="fs" style="color:var(--muted)">In the photo: ${l.seen}</div>`:''}
      </div></div>
    <div class="pq"><span class="pql">How much did you actually eat?</span>
      <div class="pqr">${PORTIONS.map(([v,lab])=>`<button class="${f===v?'on':''}" onclick="setPortion('${id}',${v})">${lab}</button>`).join('')}</div></div>
    <div class="fs" style="margin-top:9px"><b>${fmt(l.sat)}g sat fat</b> (${satPct}% of today) · ${Math.round(l.na)}mg sodium (${naPct}%) · ${Math.round(l.kcal)} kcal</div>
    <div class="fa"><button onclick="editLog('${id}')">Edit</button>
      <button onclick="deleteEntry('${id}')">Delete</button></div></div>`;
}

function flashEl(){ return document.getElementById('flash'); }

function onPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async e=>{
    const full=e.target.result;
    pendingThumb=await shrink(full,160,0.7);
    pendingFull =await shrinkToBudget(full, S.photoKB||100, 900);
    pendingPhoto=pendingThumb;
    input.value='';
    if(!S.apiKey){
      pendingPhoto=null;
      showFlash(`<div class="flash warn">
        <div class="fh">The camera isn't connected yet</div>
        <div class="fs">Add an Anthropic API key and photos will fill themselves in. Takes about two minutes.</div>
        <div class="fa"><button onclick="openKey()">Set it up</button>
          <button onclick="openCustom({note:'Enter it by hand.'})">Type this one in</button></div></div>`);
      return;
    }
    showFlash(`<div class="flash ok"><div class="fr">
      <img class="fimg" src="${pendingPhoto}" alt="Your photo">
      <div style="flex:1;min-width:0"><div class="fh"><span class="spin"></span> Reading the photo…</div>
      <div class="fs">Identifying the dish and estimating the portion.</div></div></div></div>`);
    try{
      const big=await shrink(full,900);
      const out=await identify(big);

      if(out.notFood){
        const shown=pendingThumb;
        clearPending();                       // discarded — never written to storage
        showFlash(`<div class="flash warn">
          <div class="fr"><img class="fimg dim" src="${shown}" alt="Discarded photo"><div style="flex:1;min-width:0">
          <div class="fh">No food in that photo</div>
          <div class="fs">${out.saw? 'It saw: '+out.saw+'.' : ''} Nothing logged, and this photo was <b>not</b> saved.</div>
          </div></div>
          <div class="fa"><button onclick="document.getElementById('cam').click()">Try again</button>
            <button onclick="openCustom({note:'Enter it by hand.'})">Type it in</button></div></div>`);
        return;
      }

      const meal = out.meal && MEAL_ORDER.includes(out.meal) ? out.meal : mealOf(Date.now());

      // Confident → log it and get out of the way. Unsure → ask.
      if(out.confidence==='high'){
        const entry={id:uid(),date:cur,ts:Date.now(),dishId:null,name:out.name||'Meal',qty:1,meal,auto:true,
          seen:out.portionSeen||'', hasPhoto:!!pendingThumb,
          base:{kcal:out.kcal,sat:out.sat,na:out.na,sug:out.sug,pur:out.pur},
          kcal:out.kcal,sat:out.sat,na:out.na,sug:out.sug,pur:out.pur};
        await commitPhoto(entry.id);
        S.logs.push(entry); save(); render();
        showFlash(flashFor(entry.id));
        return;
      } else {

        showFlash('');
        openCustom({...out, meal,
          note:`<b>Not fully sure about this one.</b> ${out.why||'Check the numbers before saving.'}`});
      }
    }catch(err){
      pendingPhoto=null;                      // nothing legit to keep
      const needsKey = err.kind==='key' || err.kind==='billing';
      showFlash(`<div class="flash warn">
        <div class="fh">${err.title||'Something went wrong'}</div>
        <div class="fs">${err.fix||String(err.message||err).slice(0,160)}</div>
        <div class="fa">
          ${needsKey?`<button onclick="openKey()">Open settings</button>`:''}
          <button onclick="document.getElementById('cam').click()">Try another photo</button>
          <button onclick="pendingPhoto=null;openCustom({note:'Enter it by hand.'})">Type it in</button>
        </div></div>`);
    }
  };
  r.readAsDataURL(f);
}

async function editLog(id){

  const rec=await IDB.get(id);
  if(rec){ pendingThumb=rec.thumb; pendingFull=rec.full; pendingPhoto=rec.thumb; }
  S.logs=S.logs.filter(x=>x.id!==id); delete THUMBS[id]; await IDB.del(id); save();
  openCustom({name:l.name,kcal:l.kcal,sat:l.sat,na:l.na,sug:l.sug,pur:l.pur,meal:l.meal,note:'Correcting a logged entry.'});

}
function shrink(dataUrl,max,quality){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.max(1,img.width*s|0); c.height=Math.max(1,img.height*s|0);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',quality==null?0.75:quality));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

/* Encode down to a byte budget instead of a fixed pixel size — a plain bowl
   of fruit can stay large, a busy hawker plate gets compressed harder. */
async function shrinkToBudget(dataUrl, budgetKB, startPx){
  const budget=budgetKB*1024*1.37;             // base64 inflates ~37%
  let px=startPx||900, q=0.82, out=await shrink(dataUrl,px,q);
  let guard=0;
  while(out.length>budget && guard++<8){
    if(q>0.55) q-=0.08; else px=Math.round(px*0.82);
    out=await shrink(dataUrl,px,q);
  }
  return out;
}
async function identify(dataUrl){
  const b64=dataUrl.split(',')[1];
  const known=DB.map(d=>`${d.n} (${d.srv}): ${d.kcal}kcal, ${d.sat}g sat, ${d.na}mg Na, ${d.sug}g sugar, ${d.pur}mg purine`).join('\n');
  const body={
    model:'claude-opus-4-5-20251101', max_tokens:400,
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:`Identify this meal and estimate its nutrition for ONE serving as shown.

Here is a reference table of dishes this person eats, with values I trust — if the photo matches one, reuse its numbers, scaled to the visible portion:
${known}

Purine matters here (the person has gout). Rough guide, mg per 100g: pork/beef 75–120 · chicken breast 141 · chicken thigh 123 · pork liver 285 · squid 170 · prawn 195 · sardine 210 · tuna 157 · salmon 119 · tofu 20–31 · eggs 0 · dairy 0 · vegetables 3–70 · rice 26. Long-boiled meat/bone BROTH is very high — a bowl of ramen or pork-noodle soup that is drunk adds 150–460mg on its own.

PRIORITY: this person has a coronary calcium score of 91 and LDL 5.2 mmol/L. **Saturated fat is the number that matters most**, then sodium. Purine/gout is secondary. Write the note about saturated fat unless something else is clearly worse.

The local time is ${new Date().toLocaleTimeString()} — so the meal is probably "${mealOf(Date.now())}", but override that if the food obviously says otherwise.

**Report the nutrition for the ENTIRE portion visible in the photo** — the whole bowl, the whole plate. Do not try to guess how much of it the person will actually eat; they set that themselves afterwards. In "portionSeen", describe what you measured in plain words with a rough weight, e.g. "a full bowl, roughly 200g of cantaloupe" or "one plate, about 350g".

Set confidence to "high" ONLY if you can clearly identify the dish AND judge the total amount in frame. Use "low" if the photo is unclear, the dish is ambiguous, several dishes share the frame, or the portion is hard to judge — being wrong is worse than asking.

**If the photo contains no identifiable food or drink** — it's a person, a wall, a screen, a blur, anything else — do NOT guess and do NOT explain in prose. Reply with exactly this shape:
{"notFood":true,"saw":"what is actually in the photo, 3-6 words"}

Otherwise reply with ONLY a JSON object, no other text and no markdown fences:
{"name":"dish name","kcal":number,"sat":number,"na":number,"sug":number,"pur":number,"meal":"Breakfast|Lunch|Dinner|Late snack","portionSeen":"what you measured, e.g. a full bowl, roughly 200g","confidence":"high|low","why":"if confidence is low, what you're unsure about, one short phrase","note":"one short sentence on the biggest issue with this meal — usually saturated fat"}`}
    ]}]
  };
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':S.apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)
    });
  }catch(e){ throw aiErr('offline','No connection','Your phone couldn\'t reach Anthropic. Check your signal or Wi-Fi and try again.'); }

  if(!r.ok){
    const t=await r.text().catch(()=>'');
    if(r.status===401) throw aiErr('key','That API key was rejected','The key is missing, mistyped, or has been revoked. Open Settings and paste a fresh one.');
    if(r.status===403) throw aiErr('key','Key not permitted','This key doesn\'t have access. Create a new one in the Anthropic console.');
    if(r.status===429) throw aiErr('rate','Too many requests','Wait a minute and try again.');
    if(r.status===400 && /credit|balance|billing/i.test(t))
      throw aiErr('billing','Out of credit','Your Anthropic account has no balance left. Add credit under Billing at console.anthropic.com.');
    if(r.status===404) throw aiErr('model','Model unavailable','The model this app asks for isn\'t available on your account.');
    if(r.status>=500) throw aiErr('server','Anthropic is having trouble','Their end, not yours. Try again shortly.');
    throw aiErr('other','Request failed ('+r.status+')', String(t).slice(0,140));
  }

  const j=await r.json();
  const txt=(j.content||[]).map(c=>c.text||'').join('').trim();
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m) throw aiErr('noparse','Couldn\'t read the reply', txt? ('It said: "'+txt.slice(0,150)+'"') : 'It returned nothing.');
  let o; try{ o=JSON.parse(m[0]); }
  catch(e){ throw aiErr('noparse','Couldn\'t read the reply','The reply wasn\'t valid JSON.'); }

  if(o.notFood) return {notFood:true, saw:o.saw||''};
  return {name:o.name||'', kcal:Math.round(o.kcal||0), sat:+(o.sat||0), na:Math.round(o.na||0),
          sug:+(o.sug||0), pur:Math.round(o.pur||0), note:o.note||'',
          meal:o.meal||'', portionSeen:o.portionSeen||'',
          confidence:(o.confidence==='high'?'high':'low'), why:o.why||''};
}
function aiErr(kind,title,fix){ const e=new Error(title); e.kind=kind; e.title=title; e.fix=fix; return e; }

/* ============================================================
   BACKUP — one private GitHub gist. Numbers back up constantly
   (they're tiny); photos are sharded under 1MB per file so the
   gist API never truncates them on the way back down.
   Secrets are deliberately NOT backed up.
   ============================================================ */
const GH='https://api.github.com';
const SHARD_MAX=800000;
let backupTimer=null, backupBusy=false;

function ghHeaders(){ return {'Authorization':'Bearer '+S.ghToken,
  'Accept':'application/vnd.github+json','Content-Type':'application/json'}; }

async function ghErr(r){
  let t=''; try{ t=(await r.json()).message||''; }catch(e){}
  if(r.status===401) return 'Token rejected — check it has the "gist" scope and hasn\'t expired.';
  if(r.status===403) return 'Forbidden — the token is missing the "gist" scope.';
  if(r.status===404) return 'Backup not found. It may have been deleted — disconnect and reconnect.';
  if(r.status===422) return 'GitHub refused the data ('+(t||'too large?')+').';
  return 'GitHub error '+r.status+(t?' — '+t:'');
}

function splitState(){
  const data={v:2, logs:S.logs.map(l=>{const c={...l}; delete c.photo; return c;}),
              flares:S.flares, weights:S.weights, headaches:S.headaches,
              targets:S.targets, recent:S.recent, savedAt:Date.now()};
  return {data};                               // apiKey and ghToken never leave the phone
}
async function photosForBackup(){
  const all=await IDB.entries(); const out={};
  const days=S.backupPhotoDays||0;             // 0 = everything
  const cut=days? Date.now()-days*864e5 : 0;
  for(const id of Object.keys(all)){
    const l=S.logs.find(x=>x.id===id);
    if(cut && l && new Date(l.date).getTime()<cut) continue;
    out[id]=all[id].full||all[id].thumb;
  }
  return out;
}
function shardPhotos(photos){
  const shards=[]; let cur={}, size=0;
  for(const k of Object.keys(photos)){
    const v=photos[k];
    if(size && size+v.length>SHARD_MAX){ shards.push(cur); cur={}; size=0; }
    cur[k]=v; size+=v.length;
  }
  if(Object.keys(cur).length) shards.push(cur);
  return shards;
}

async function ensureGist(){
  if(S.gistId) return S.gistId;
  const r=await fetch(GH+'/gists',{method:'POST',headers:ghHeaders(),body:JSON.stringify({
    description:'Food log backup (private) — created by the eating-plan app',
    public:false, files:{'foodlog-data.json':{content:'{}'}}
  })});
  if(!r.ok) throw new Error(await ghErr(r));
  const j=await r.json();
  S.gistId=j.id; S.gistUrl=j.html_url; saveLocal();
  return j.id;
}

function scheduleBackup(){
  clearTimeout(backupTimer);
  backupTimer=setTimeout(()=>pushBackup(false), 4000);
}

async function pushBackup(withPhotos, manual){
  if(!S.ghToken){ if(manual) alert('Connect GitHub first.'); return false; }
  if(backupBusy) return false;
  backupBusy=true; if(manual) render();
  try{
    const id=await ensureGist();
    const {data}=splitState();
    const files={'foodlog-data.json':{content:JSON.stringify(data)}};

    if(withPhotos){
      const photos=await photosForBackup();
      const shards=shardPhotos(photos);
      shards.forEach((s,i)=>{ files['foodlog-photos-'+String(i+1).padStart(2,'0')+'.json']={content:JSON.stringify(s)}; });
      // remove shards that are no longer needed
      for(let i=shards.length; i<(S.photoShards||0); i++)
        files['foodlog-photos-'+String(i+1).padStart(2,'0')+'.json']=null;
      S.photoShards=shards.length;
    }
    const r=await fetch(GH+'/gists/'+id,{method:'PATCH',headers:ghHeaders(),body:JSON.stringify({files})});
    if(!r.ok) throw new Error(await ghErr(r));
    S.lastBackup=Date.now(); if(withPhotos) S.lastPhotoBackup=Date.now();
    S.backupErr=''; saveLocal();
    if(manual) alert('Backed up.');
    return true;
  }catch(e){
    S.backupErr=String(e.message||e).slice(0,160); saveLocal();
    if(manual) alert('Backup failed — '+S.backupErr);
    return false;
  }finally{ backupBusy=false; if(tab==='health') render(); }
}

async function restoreBackup(){
  if(!S.ghToken||!S.gistId){ alert('Nothing connected to restore from.'); return; }
  if(!confirm('Replace everything on this phone with the last backup? Anything logged since then will be lost.')) return;
  try{
    const r=await fetch(GH+'/gists/'+S.gistId,{headers:ghHeaders()});
    if(!r.ok) throw new Error(await ghErr(r));
    const j=await r.json();
    const df=j.files['foodlog-data.json'];
    if(!df) throw new Error('That backup has no data file.');
    const data=JSON.parse(df.content||'{}');
    const photos={};
    for(const name of Object.keys(j.files)){
      if(!/^foodlog-photos-\d+\.json$/.test(name)) continue;
      const f=j.files[name];
      const txt = f.truncated && f.raw_url ? await (await fetch(f.raw_url)).text() : (f.content||'{}');
      Object.assign(photos, JSON.parse(txt||'{}'));
    }
    for(const pid of Object.keys(photos)){
      await IDB.put(pid,{thumb:photos[pid], full:photos[pid], ts:Date.now()});
      THUMBS[pid]=photos[pid];
    }
    const keepTok=S.ghToken, keepKey=S.apiKey, keepId=S.gistId, keepUrl=S.gistUrl;
    S=Object.assign(blank(), {
      logs:(data.logs||[]),
      flares:data.flares||[], weights:data.weights||[], headaches:data.headaches||[],
      targets:Object.assign({...DEFAULT_TARGETS}, data.targets||{}), recent:data.recent||[],
      ghToken:keepTok, apiKey:keepKey, gistId:keepId, gistUrl:keepUrl, lastBackup:Date.now()
    });
    saveLocal(); render();
    alert(`Restored ${S.logs.length} meals, ${Object.keys(photos).length} photos, ${S.flares.length} flares.`);
  }catch(e){ alert('Restore failed — '+String(e.message||e).slice(0,160)); }
}

function agoTxt(ts){
  if(!ts) return 'never';
  const s=Math.round((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' d ago';
}

function openGit(){
  openSheet(`<h2>Back up to GitHub</h2>
    <p class="muted" style="margin:-4px 0 14px">Your log goes into one <b>private</b> gist on your own account. Because gists are git repos, you also get version history — you can walk back to an earlier day if anything ever goes wrong.</p>
    <div class="hint" style="font-size:13px">
      <b>1.</b> Open <b>github.com/settings/tokens</b><br>
      <b>2.</b> <b>Generate new token</b> → <b>classic</b><br>
      <b>3.</b> Tick only the <b>gist</b> checkbox — nothing else<br>
      <b>4.</b> Set expiry to <b>No expiration</b> (or you'll redo this)<br>
      <b>5.</b> Generate, copy, paste below
    </div>
    <div class="fld" style="margin-top:14px"><label>Paste your GitHub token</label>
      <input type="password" id="g_v" value="${S.ghToken||''}" placeholder="ghp_…" autocomplete="off" spellcheck="false"></div>
    <p class="tiny" style="margin:-4px 0 14px">Stays on this phone. <b>Your API keys are never included in the backup</b> — only your food, flares, weights and headaches.</p>
    <button class="btn full" onclick="saveGit()">Connect and back up now</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeSheet()">Later</button>`);
}
async function saveGit(){
  const v=document.getElementById('g_v').value.trim();
  S.ghToken=v; saveLocal(); closeSheet(); render();
  if(v) await pushBackup(true, true);
}
function disconnectGit(){
  if(!confirm('Disconnect GitHub? The existing backup stays on GitHub — this only stops future backups.')) return;
  S.ghToken=''; S.gistId=''; S.gistUrl=''; S.lastBackup=0; S.lastPhotoBackup=0; S.backupErr=''; saveLocal(); render();
}

async function copySetupLink(){
  if(!S.apiKey && !S.ghToken){ alert('Nothing to put in the link yet — connect a key first.'); return; }
  const q=[]; if(S.apiKey) q.push('k='+encodeURIComponent(S.apiKey));
  if(S.ghToken) q.push('g='+encodeURIComponent(S.ghToken));
  const url=location.origin+location.pathname+'#'+q.join('&');
  try{ await navigator.clipboard.writeText(url);
    alert('Setup link copied.\n\nBookmark it, or send it to yourself. Anyone who opens it gets your keys, so keep it to yourself.');
  }catch(e){ prompt('Copy this and bookmark it:', url); }
}
async function forceUpdate(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ try{ await r.update(); }catch(e){} }
    }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    alert('Refreshed. Your log, photos and keys are untouched.');
    location.reload(true);
  }catch(e){ alert('Update check failed — '+String(e.message||e)); }
}
async function refreshPersistStat(){
  const el=document.getElementById('perstat'); if(!el) return;
  try{ el.textContent = (navigator.storage&&navigator.storage.persisted) ? ((await navigator.storage.persisted())?'yes':'not granted') : 'unsupported'; }
  catch(e){ el.textContent='unknown'; }
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`foodlog-${todayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============================================================
   WIRING
   ============================================================ */
function go(t){ closeSheet(); tab=t; render(); }
document.getElementById('bld').textContent='v'+BUILD;

/* Ask the browser to mark this storage as persistent so it isn't evicted
   under pressure. Safari grants this readily once the app is on the home
   screen, which is the single biggest thing that stops keys vanishing. */
(async()=>{ try{
  if(navigator.storage && navigator.storage.persist){
    const already=await navigator.storage.persisted();
    if(!already) await navigator.storage.persist();
  }
}catch(e){} })();

/* Keys can be carried in the URL fragment. A fragment is never sent to the
   server and never appears in the repo — so bookmarking a setup link means
   that even a full "clear website data" is one tap from recovered. */
function readHashKeys(){
  if(!location.hash) return;
  const q=new URLSearchParams(location.hash.slice(1));
  const k=q.get('k'), g=q.get('g');
  let got=false;
  if(k){ S.apiKey=decodeURIComponent(k); got=true; }
  if(g){ S.ghToken=decodeURIComponent(g); got=true; }
  if(got){ saveLocal();
    history.replaceState(null,'',location.pathname+location.search);   // strip it back off
    render();
    setTimeout(()=>showFlash(`<div class="flash ok"><div class="fh">Keys restored from your setup link</div>
      <div class="fs">Camera and backup are connected again.</div></div>`),300);
  }
}
readHashKeys();
// also handle tapping the bookmark while the app is already open
window.addEventListener('hashchange', readHashKeys);
(async()=>{ try{ const all=await IDB.entries();
  for(const k of Object.keys(all)) THUMBS[k]=all[k].thumb||all[k].full;
  // migrate any photos still living in localStorage from older builds
  let moved=0;
  for(const l of S.logs){ if(l.photo){ await IDB.put(l.id,{thumb:l.photo,full:l.photo,ts:l.ts});
    THUMBS[l.id]=l.photo; l.hasPhoto=true; delete l.photo; moved++; } }
  if(moved) saveLocal();
  render();
}catch(e){ console.warn('photo load failed',e); } })();
document.querySelectorAll('.nv button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById('gear').onclick=()=>{ tab='health'; render(); setTimeout(()=>{
  const s=document.getElementById('settings'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'});
},60); };
document.getElementById('prev').onclick=()=>{ cur=shiftKey(cur,-1); render(); };
document.getElementById('next').onclick=()=>{ if(cur<todayKey()){ cur=shiftKey(cur,1); render(); } };
render();

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden' && S.ghToken){
    if(Date.now()-(S.lastPhotoBackup||0) > 6*3600*1000) pushBackup(true);
    else pushBackup(false);
  }
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
