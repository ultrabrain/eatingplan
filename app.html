<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Food Log</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c5cab" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food Log">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f9f9f7; --raised:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --blue:#2a78d6; --blue-d:#1c5cab; --blue-l:#86b6ef;
  --aqua:#1baf7a; --orange:#eb6834; --violet:#4a3aa7;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d; --raised:#232322;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --blue:#3987e5; --blue-d:#5598e7; --blue-l:#184f95;
    --aqua:#199e70; --orange:#d95926; --violet:#9085e9;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(68px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 24px;
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
h1{font-size:20px;margin:0;letter-spacing:-0.02em}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-0.01em}
h3{font-size:13px;margin:18px 0 7px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);font-weight:650}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:15px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:11.5px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;background:var(--raised);color:var(--ink);
  border:1px solid var(--ring);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{background:var(--blue);color:#fff;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14.5px;text-align:center;display:inline-block}
.btn.ghost{background:var(--raised);color:var(--ink);border:1px solid var(--ring)}
.btn.danger{background:var(--crit)}
.btn.full{display:block;width:100%}
.btn:active{opacity:.75}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--page);
  padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--grid)}
.hd{max-width:640px;margin:0 auto;padding:8px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:17px}
.datenav button:active{background:var(--grid)}
.dlab{font-size:13.5px;font-weight:600;min-width:82px;text-align:center}

/* meters */
.meter{margin:13px 0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px}
.meter .nm{font-weight:600}
.meter .vals{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px}
.meter .track{height:9px;background:var(--grid);border-radius:5px;overflow:hidden;position:relative}
.meter .fill{height:100%;border-radius:5px;transition:width .3s ease}
.meter .why{font-size:11.5px;color:var(--muted);margin-top:3px}
.pct{font-weight:700;font-variant-numeric:tabular-nums}

/* dish list */
.search{margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;padding:6px 12px;border-radius:18px;background:var(--raised);border:1px solid var(--ring);color:var(--ink2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.dish{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--grid);width:100%;text-align:left}
.dish:last-child{border-bottom:0}
.dish:active{background:var(--grid)}
.dish .info{flex:1;min-width:0}
.dish .nm{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dish .add{flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;line-height:1;font-weight:400}
.flag{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}

/* logged entries */
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.entry:last-child{border-bottom:0}
.entry .t{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px;flex:none}
.entry .e-nm{flex:1;font-size:14px;min-width:0}
.entry .e-nm small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.entry .del{color:var(--muted);padding:6px 4px;font-size:16px}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--ring)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--grid);padding-bottom:env(safe-area-inset-bottom)}
.nv{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nv button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600}
.nv button.on{color:var(--blue)}
.nv .ic{font-size:19px;line-height:1}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;max-width:640px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--axis);border-radius:2px;margin:0 auto 14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.qty{display:flex;gap:8px}
.qty button{flex:1;padding:9px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:13.5px;font-weight:600}
.qty button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* misc */
.pill{font-size:11px;font-weight:650;padding:2px 7px;border-radius:12px;white-space:nowrap}
.pill.ok{background:rgba(12,163,12,.14);color:#0a7a0a}
.pill.warn{background:rgba(250,178,25,.2);color:#8a5c00}
.pill.bad{background:rgba(208,59,59,.14);color:#a12b2b}
@media(prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .pill.ok{color:#0ca30c}
 :root:where(:not([data-theme="light"])) .pill.warn{color:#fab219}
 :root:where(:not([data-theme="light"])) .pill.bad{color:#e66767}}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin:10px 0 4px}
.bars .b{flex:1;background:var(--blue-l);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b.over{background:var(--crit)}
.blabs{display:flex;gap:3px;font-size:9.5px;color:var(--muted);text-align:center}
.blabs span{flex:1}
.hint{background:rgba(42,120,214,.07);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;margin:10px 0}
.hint.bad{background:rgba(208,59,59,.06);border-color:var(--crit)}
.hint.good{background:rgba(12,163,12,.06);border-color:var(--good)}
.hint b{font-weight:650}
hr{border:0;border-top:1px solid var(--grid);margin:16px 0}
.swaprow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.swaprow:last-child{border-bottom:0}
.swaprow .ar{color:var(--muted);flex:none}
.swaprow .sv{margin-left:auto;font-size:12px;font-weight:650;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ring);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* camera hero */
.shoot{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--blue);color:#fff;border-radius:15px;padding:16px 17px;margin-bottom:12px;
  box-shadow:0 2px 10px rgba(42,120,214,.28)}
.shoot:active{transform:scale(.985)}
.shoot.setup{background:var(--surface);color:var(--ink);border:1.5px dashed var(--blue);box-shadow:none}
.shoot.setup .cico{color:var(--blue)}
.shoot.setup small{opacity:1;color:var(--ink2)}
#gear{font-size:16px}
.shoot .cico{font-size:26px;line-height:1;flex:none}
.shoot b{display:block;font-size:15.5px;font-weight:650}
.shoot small{display:block;font-size:12px;opacity:.9;margin-top:2px;line-height:1.35}

/* grouped meter cards */
.ghead{display:flex;flex-direction:column;gap:1px;margin-bottom:4px;padding-bottom:9px;border-bottom:1px solid var(--grid)}
.gn{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.gs{font-size:11.5px;color:var(--muted)}
.card.secondary{background:transparent;border-style:dashed}
.card.secondary .gn{color:var(--muted)}
.card.secondary .meter .nm{font-weight:500;color:var(--ink2)}
.meter.hero .nm{font-size:16px}
.meter.hero .pct{font-size:17px}
.meter.hero .track{height:12px}

/* result flash */
.flash{border-radius:13px;padding:14px 15px;margin-bottom:12px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.flash.ok{background:rgba(12,163,12,.1);border:1px solid rgba(12,163,12,.3)}
.flash.warn{background:rgba(208,59,59,.08);border:1px solid rgba(208,59,59,.3)}
.flash .fh{font-weight:650;font-size:15px;margin-bottom:3px}
.flash .fs{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.flash .fa{display:flex;gap:8px;margin-top:10px}
.flash .fa button{flex:1;padding:8px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:13px;font-weight:600}
.fr{display:flex;gap:11px;align-items:flex-start}
.fimg{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--ring);cursor:pointer}
.fimg.dim{opacity:.4;filter:grayscale(1)}
.netline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;
  background:var(--grid);border-radius:9px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.netline b{color:var(--ink);font-weight:650}
.dlab{font-size:13.5px;font-weight:600;min-width:82px;text-align:center;padding:5px 6px;border-radius:8px}
.dlab:active{background:var(--grid)}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:650;font-size:15px}
.calhd button{width:34px;height:34px;border-radius:9px;font-size:19px;color:var(--ink2)}
.calhd button:active{background:var(--grid)}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.caldow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--raised);border:1px solid transparent}
.cd.empty{background:transparent}
.cd.sel{border-color:var(--blue);background:rgba(42,120,214,.10)}
.cd.fut{opacity:.28}
.cd:active:not(.fut){background:var(--grid)}
.cdn{font-size:12.5px;font-variant-numeric:tabular-nums}
.cdot{width:7px;height:7px;border-radius:50%;display:block}
.callegend{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;font-size:11px;color:var(--ink2)}
.callegend span{display:inline-flex;align-items:center;gap:4px}
.callegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sb{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:5px;vertical-align:1px;margin-left:4px}
.sb.meas{background:rgba(12,163,12,.16);color:#0a7a0a}
.sb.save{background:rgba(42,120,214,.16);color:var(--blue)}
.sb.newb{background:rgba(250,178,25,.20);color:#8a5c00}
.bdsrc{font-size:11.5px;color:var(--ink2);margin:-3px 0 8px}
@media(prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .sb.meas{color:#0ca30c}
 :root:where(:not([data-theme="light"])) .sb.newb{color:#fab219}}
.fthumb{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--ring)}
.bd{background:var(--raised);border:1px solid var(--ring);border-radius:11px;padding:11px 12px;margin-top:11px}
.bdh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.bdrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--grid)}
.bdrow:last-of-type{border-bottom:0}
.bdn{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.bdn small{display:block;font-weight:400;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.bdq{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:34px;text-align:right}
.bdv{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.bdv small{font-weight:400;color:var(--muted);font-size:10px;margin-left:2px}
.stp{display:flex;align-items:center;gap:2px;flex:none}
.stp button{width:26px;height:26px;border-radius:7px;background:var(--grid);font-size:16px;line-height:1;color:var(--ink)}
.stp span{min-width:30px;text-align:center;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.bdtot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--axis);font-size:13px}
.pq{margin-top:11px;padding-top:10px;border-top:1px solid var(--ring)}
.pql{font-size:12px;font-weight:650;color:var(--ink2);display:block;margin-bottom:7px}
.pqr{display:flex;gap:5px}
.pqr button{flex:1;padding:8px 2px;border-radius:9px;background:var(--raised);border:1px solid var(--ring);font-size:12.5px;font-weight:600}
.pqr button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chipbtn{font-size:12px;font-weight:600;padding:5px 10px;border-radius:14px;border:1px solid var(--ring);
  background:var(--surface);color:var(--ink2);margin:6px 5px 0 0}
.chipbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lnk{color:var(--blue);font-weight:650;text-decoration:underline;padding:0 0 0 4px;font-size:12.5px}
.conf{font-size:11px;font-weight:650;padding:2px 7px;border-radius:11px;background:var(--grid);color:var(--ink2);margin-left:6px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1 id="title">Today</h1><span id="bld" class="tiny" style="margin-left:-4px;align-self:flex-end;padding-bottom:3px"></span>
    <div class="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button class="dlab" id="dlab" onclick="openCal()">—</button>
      <button id="next" aria-label="Next day">›</button>
      <button id="gear" aria-label="Settings" title="Settings" style="margin-left:2px">⚙</button>
    </div>
  </div>
</header>

<div class="wrap" id="view"></div>

<nav><div class="nv">
  <button data-tab="today" class="on"><span class="ic">◍</span>Today</button>
  <button data-tab="add"><span class="ic">☰</span>Food options</button>
  <button data-tab="trends"><span class="ic">◫</span>Trends</button>
  <button data-tab="health"><span class="ic">♡</span>Health</button>
</div></nav>

<input type="file" id="fpic" accept="image/*" style="display:none">
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ============================================================
   FOOD DATABASE — built from measured sources where they exist.
   grade: M = lab-measured · C = calculated from ingredients
          E = estimated from nearest measured analogue (±30%)
   Values are PER SERVING as listed in `srv`.
   pur = total purine mg (Kaneko 2014 HPLC basis where measured)
   ============================================================ */
const DB = [
// --- BREAKFAST ---
{id:'siewpau',   n:'Siew pau',                    g:'bfast', srv:'1 pc ~65g',  kcal:240, sat:6.5, na:350,  sug:6,   pur:50,  grade:'E'},
{id:'cspau',     n:'Char siew pau',               g:'bfast', srv:'1 pc 120g',  kcal:363, sat:4,   na:450,  sug:12,  pur:50,  grade:'M/E'},
{id:'siewmai',   n:'Siew mai (4 pc)',             g:'bfast', srv:'4 pc ~128g', kcal:232, sat:3.2, na:800,  sug:2,   pur:90,  grade:'M'},
{id:'eggtart',   n:'Portuguese egg tart',         g:'bfast', srv:'1 pc ~60g',  kcal:265, sat:8,   na:180,  sug:7.3, pur:5,   grade:'E'},
{id:'meehoong',  n:'Mee hoon goreng + sambal + fried egg', g:'bfast', srv:'~300g', kcal:640, sat:9, na:1700, sug:13, pur:60, grade:'E'},
{id:'csrice',    n:'Char siew rice',              g:'bfast', srv:'327g',       kcal:605, sat:6.5, na:880,  sug:12,  pur:150, grade:'M'},
{id:'syrice',    n:'Siew yok rice',               g:'bfast', srv:'~350g',      kcal:700, sat:21,  na:900,  sug:4,   pur:110, grade:'C'},

// --- LUNCH / HAWKER ---
{id:'nlayam',    n:'Nasi lemak ayam berempah',    g:'lunch', srv:'~360g',      kcal:875, sat:15,  na:1550, sug:8,   pur:190, grade:'C'},
{id:'nlplain',   n:'Nasi lemak (plain)',          g:'lunch', srv:'210g',       kcal:494, sat:7.6, na:838,  sug:6.5, pur:120, grade:'M'},
{id:'wtmdry',    n:'Wantan mee (dry)',            g:'lunch', srv:'330g',       kcal:411, sat:5,   na:1502, sug:10,  pur:160, grade:'M'},
{id:'wtmsoup',   n:'Wantan mee (soup)',           g:'lunch', srv:'545g',       kcal:290, sat:4.5, na:1804, sug:6,   pur:230, grade:'M'},
{id:'panmeed',   n:'Pan mee (dry)',               g:'lunch', srv:'311g',       kcal:511, sat:9.2, na:1491, sug:3,   pur:150, grade:'M'},
{id:'panmees',   n:'Pan mee (soup)',              g:'lunch', srv:'528g',       kcal:475, sat:8.4, na:2196, sug:3,   pur:200, grade:'M'},
{id:'burgerlab', n:'myBurgerLab + fries',         g:'lunch', srv:'~400g',      kcal:1050,sat:21,  na:1750, sug:12,  pur:120, grade:'E'},

/* Eating doesn't fall neatly into three meals — especially around training.
   Time gives a sensible default; the workout slots are chosen deliberately. */
function mealOf(ts){
  const d=new Date(ts), m=d.getHours()*60+d.getMinutes();
  if(m<630)  return 'Breakfast';        // before 10:30
  if(m<690)  return 'Morning snack';    // 10:30–11:30
  if(m<870)  return 'Lunch';            // 11:30–14:30
  if(m<1050) return 'Afternoon snack';  // 14:30–17:30
  if(m<1290) return 'Dinner';           // 17:30–21:30
  return 'Supper';
}
const MEAL_ORDER=['Pre-workout','During workout','Post-workout','Breakfast','Morning snack',
                  'Lunch','Afternoon snack','Dinner','Supper'];
const WORKOUT_SLOTS=['Pre-workout','During workout','Post-workout'];

/* If a run is logged that day, offer the training slots first — most people
   fuelling a session are logging within a couple of hours of it. */
function slotSuggestion(ts,dateKey){
  const ws=(S.workouts||[]).filter(w=>w.date===dateKey);
  if(!ws.length) return null;
  const w=ws[0];
  if(!w.time) return {w, slot:null};
  const wStart=tsFrom(dateKey,w.time), wEnd=wStart+(+w.mins||60)*60000;
  if(ts>=wStart-2*36e5 && ts<wStart) return {w, slot:'Pre-workout'};
  if(ts>=wStart && ts<=wEnd)          return {w, slot:'During workout'};
  if(ts>wEnd && ts<=wEnd+2*36e5)      return {w, slot:'Post-workout'};
  return {w, slot:null};
}

const IDB={
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{
    const r=indexedDB.open('foodlog',1);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); };
    r.onerror=()=>rej(r.error);
  });},
  async tx(mode){ const d=await this.open(); return d.transaction('photos',mode).objectStore('photos'); },
  async put(id,rec){ const s=await this.tx('readwrite'); return new Promise((res,rej)=>{ const q=s.put(rec,id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); },
  async get(id){ const s=await this.tx('readonly'); return new Promise((res)=>{ const q=s.get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  async del(id){ const s=await this.tx('readwrite'); return new Promise((res)=>{ const q=s.delete(id); q.onsuccess=()=>res(); q.onerror=()=>res(); }); },
  async entries(){ const s=await this.tx('readonly'); return new Promise((res)=>{
    const out={}; const q=s.openCursor();
    q.onsuccess=()=>{ const c=q.result; if(!c){ res(out); return; } out[c.key]=c.value; c.continue(); };
    q.onerror=()=>res(out); });},
  async clear(){ const s=await this.tx('readwrite'); return new Promise(res=>{ const q=s.clear(); q.onsuccess=()=>res(); q.onerror=()=>res(); }); }
};

/* Builds before v26 wrote "free" (no-AI) entries with flat, pre-multiplied item
   figures — {name,qty,kcal,...} — instead of per-unit {present,eaten,per:{}}.
   Those entries have no i.eaten, which crashes the day view. Convert them once,
   in place, dividing back out by qty to recover the per-unit numbers.
   Anything already in the new shape is left untouched. */
function migrate(s){
  let fixed=0;
  for(const l of (s.logs||[])){
    if(!Array.isArray(l.items) || !l.items.length) continue;
    let touched=0;                       // THIS entry — not a running total.
    l.items=l.items.map(i=>{
      if(i && i.per && i.eaten!=null) return i;             // already per-unit
      const q=Math.max(0.01, +i.qty || +i.present || 1);
      const d=v=>{ const n=+v; return isFinite(n) ? +(n/q).toFixed(3) : 0; };
      fixed++; touched++;
      // A nameless row keeps its calories under the label "Item" rather than
      // being dropped. normItems() discards nameless rows because that is a
      // fresh AI reply we can re-ask for; this is the user's saved history, and
      // silently deleting a row would quietly change a past day's totals.
      return {name:String(i.name||'').trim()||'Item', unit:i.unit||'1 serving',
        present:q, eaten:q,
        per:i.per ? i.per : {kcal:d(i.kcal),sat:d(i.sat),na:d(i.na),
                             sug:d(i.sug),pur:d(i.pur),fru:d(i.fru)},
        src:i.src||'saved'};
    }).filter(i=>i.name);
    // Recompute ONLY entries this function actually converted. An entry already
    // in per-unit shape is left exactly as stored, even if its totals disagree
    // with its components — that is the old override-bug damage, and repairing
    // it is "Check my entries for errors", which shows you the change first.
    // Loading the app must never silently rewrite a number you logged.
    if(touched) applyItems(l);
  }
  if(fixed) console.info('migrated '+fixed+' legacy item rows to per-unit');
  return s;
}

function todayKey(d){ const x = d||new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function shiftKey(k,n){ const [y,m,d]=k.split('-').map(Number); const dt=new Date(y,m-1,d+n); return todayKey(dt); }
function prettyDate(k){
  if(k===todayKey()) return 'Today';
  if(k===shiftKey(todayKey(),-1)) return 'Yesterday';
  const [y,m,d]=k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
function timeStr(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function tsFrom(dateStr, timeStr){
  const [y,m,d]=(dateStr||todayKey()).split('-').map(Number);
  const [hh,mm]=(timeStr||'12:00').split(':').map(Number);
  return new Date(y,m-1,d,hh||0,mm||0).getTime();
}

function defaultTs(){ return cur===todayKey() ? Date.now() : tsFrom(cur, timeStr(Date.now())); }

function fuelSugar(k){ return logsFor(k).filter(isFuel).reduce((s,l)=>s+(+l.sug||0)*(l.qty||1),0); }
function totals(k){
  const t={kcal:0,sat:0,na:0,sug:0,pur:0,fru:0};
  for(const l of logsFor(k)) for(const m in t) t[m]+= (l[m]||0)*(l.qty||1);
  return t;
}

  return `<div class="meter${m.hero?' hero':''}">
    <div class="top">
      <span class="nm">${m.n}</span>
      <span class="vals"><span class="pct" style="color:${pct>100?'var(--crit)':pct>=80?'#8a5c00':'var(--ink)'}">${Math.round(pct)}%</span>
        &nbsp;${fmt(val,m.k)}${m.u} / ${tgt}${m.u}</span>
    </div>
    <div class="track"><div class="fill" style="width:${Math.min(100,pct)}%;background:${barColor(pct)}"></div></div>
    <div class="why">${pct>100? `<b style="color:var(--crit)">Over by ${fmt(over,m.k)}${m.u}.</b> ` : ''}${m.why}</div>

              <span>Fuel around training <b>${fmt(fuel)}g</b></span></div>
            <p class="tiny" style="margin:5px 0 0">Fuel isn't counted against the target — WHO's limit is about habitual diet, not sports nutrition, and sugar taken before or during a run is largely burned rather than stored (80% oxidised vs 49% at rest). <b>But see fructose below — that part exercise does not fix.</b></p>` : '');
        }
        if(m.k!=='kcal') return meterHTML(m,t[m.k],tg[m.k]);
        const net=Math.max(0,t.kcal-burn);
        return meterHTML(m, burn?net:t.kcal, tg.kcal) + (burn? `
          <div class="netline">
            <span>Eaten <b>${Math.round(t.kcal)}</b></span><span>−</span>
            <span>Burned <b>${Math.round(burn)}</b>${works[0]&&works[0].km?` <span class="tiny">(${works.reduce((s,w)=>s+(+w.km||0),0)} km)</span>`:''}</span>
            <span>=</span><span>Net <b>${Math.round(net)}</b></span>
          </div>
          <p class="tiny" style="margin:5px 0 0">Watch estimates usually run high, and your target already assumes ordinary daily movement — so treat the burn as a rough credit, not licence to eat it all back.</p>` : `
          <button class="btn ghost full" style="margin-top:9px;padding:9px;font-size:13px" onclick="openWorkout()">+ Log today's run</button>`);
      }).join('')}</div>`;
  }

  // insight
  const W={heart:1.4, metab:1.0, gout:0.55};   // weight the warning by what actually threatens him
  const worst = METRICS.map(m=>({m,pct:t[m.k]/tg[m.k]*100,w:(t[m.k]/tg[m.k]*100)*W[m.grp]}))
                       .sort((a,b)=>b.w-a.w)[0];
  if(ls.length){
    if(worst.pct>100){
      const top = ls.map(l=>({n:l.name,v:(l[worst.m.k]||0)*(l.qty||1)})).sort((a,b)=>b.v-a.v)[0];
      h += `<div class="hint bad"><b>${worst.m.n} is over budget.</b> Biggest contributor: ${top.n} at ${fmt(top.v,worst.m.k)}${worst.m.u}.
        ${swapHint(ls)}</div>`;
    } else if(worst.pct<70){
      h += `<div class="hint good"><b>Comfortably inside every budget.</b> Nothing to change today.</div>`;
    } else {
      h += `<div class="hint"><b>${worst.m.n}</b> is your tightest at ${Math.round(worst.pct)}%. ${fmt(tg[worst.m.k]-t[worst.m.k],worst.m.k)}${worst.m.u} left.</div>`;
    }
  }

  h += `<div class="card"><div class="row sp" style="margin-bottom:6px">
      <h2 style="margin:0">Logged</h2><span class="tiny">${ls.length} item${ls.length===1?'':'s'}</span></div>`;
  if(!ls.length) h += `<div class="empty">Nothing logged yet.<br><br><button class="btn ghost" onclick="go('add')">Browse food options</button></div>`;
  else {
    const byMeal={};
    for(const l of ls) (byMeal[l.meal||mealOf(l.ts)] ||= []).push(l);
    for(const meal of MEAL_ORDER){
      const items=byMeal[meal]; if(!items||!items.length) continue;
      const msat=items.reduce((s,l)=>s+l.sat*(l.qty||1),0);
      h += `<h3 style="margin:16px 0 2px">${meal} <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${fmt(msat)}g sat fat</span></h3>`;
      h += items.sort((a,b)=>a.ts-b.ts).map(l=>`
        <div class="entry">
          <span class="t">${new Date(l.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
          ${THUMBS[l.id]?`<img class="thumb" src="${THUMBS[l.id]}" alt="" onclick="viewPhoto('${l.id}')" style="cursor:pointer">`:''}
          <span class="e-nm">${l.name}${(l.qty||1)!==1?` <span class="tiny">×${l.qty}</span>`:''}
            ${l.frac!=null&&l.frac!==1?`<span class="pill warn" style="margin-left:5px">${(PORTIONS.find(p=>p[0]===l.frac)||[,''])[1]}</span>`:''}
            ${l.auto?'<span class="pill ok" style="margin-left:5px">AI</span>':''}
            <small>${Math.round(l.kcal*(l.qty||1))} kcal · <b>${fmt(l.sat*(l.qty||1))}g sat</b> · ${Math.round(l.na*(l.qty||1))}mg Na</small>
            ${(l.items&&l.items.length)?`<small style="color:var(--muted)">${l.items.map(i=>`${+(+i.eaten||0).toFixed(2)}× ${i.name}`).join(' · ')}</small>`:''}</span>
          <button class="del" onclick="editLog('${l.id}')" aria-label="Edit">✎</button>
          <button class="del" onclick="delLog('${l.id}')" aria-label="Delete">×</button>
        </div>`).join('');
    }
    h += `<button class="btn ghost full" style="margin-top:14px" onclick="go('add')">Browse food options</button>`;
  }
  h += `</div>`;
  view.innerHTML = h;
}

function swapHint(ls){
  for(const l of ls){
    const s = SWAPS.find(x=>x[0]===l.dishId);
    if(s){ const from=DB.find(d=>d.id===s[0]), to=DB.find(d=>d.id===s[1]);
      const saveNa=from.na-to.na, saveSat=from.sat-to.sat, savePur=from.pur-to.pur;
      const saveSug=from.sug-to.sug;
      const bits=[]; if(saveNa>100)bits.push(`${Math.round(saveNa)}mg sodium`);
      if(saveSat>1)bits.push(`${fmt(saveSat)}g sat fat`);
      if(saveSug>3)bits.push(`${fmt(saveSug)}g sugar`);
      if(savePur>40)bits.push(`${Math.round(savePur)}mg purine`);
      if(bits.length) return `Next time: <b>${s[2]}</b> — saves ${bits.join(', ')}.`;
    }
  }
  return '';
}

function renderDishList(){
  const el = document.getElementById('dishlist'); if(!el) return;
  const tg=S.targets;
  let list = allFoods().filter(d=> (filter==='all'||d.g===filter) && (!q || d.n.toLowerCase().includes(q.toLowerCase())));
  if(filter==='learned') list.sort((a,b)=>(b.uses||0)-(a.uses||0)||(b.ts||0)-(a.ts||0));
  if(filter==='all' && !q && S.recent.length){
    const rec = S.recent.map(id=>allFoods().find(d=>d.id===id)).filter(Boolean);
    list = [...rec, ...list.filter(d=>!S.recent.includes(d.id))];
  }
  if(!list.length){ el.innerHTML=`<div class="empty">No match.<br><br><button class="btn ghost" onclick="openCustom()">Add it manually</button></div>`; return; }
  el.innerHTML = list.map(d=>{
    const worst = Math.max(d.sat/tg.sat, d.na/tg.na, d.pur/tg.pur, d.sug/tg.sug)*100;
    const c = worst>60?'var(--crit)':worst>=35?'var(--warn)':'var(--good)';
    return `<button class="dish" onclick="openLog('${d.id}')">
      ${FOODPIC[d.id]?`<img class="fthumb" src="${FOODPIC[d.id]}" alt="">`:`<span class="flag" style="background:${c}"></span>`}

      <span class="add">+</span></button>`;
  }).join('') + `<button class="btn ghost full" style="margin-top:12px" onclick="openCustom()">Something else</button>`;
}

function renderTrends(){
  const days=[...Array(14)].map((_,i)=>shiftKey(todayKey(),-13+i));
  const tg=S.targets;
  let h='';
  for(const m of METRICS){
    const vals = days.map(d=>totals(d)[m.k]);
    const max = Math.max(tg[m.k]*1.25, ...vals) || 1;
    const logged = days.filter(d=>logsFor(d).length);
    const avg = logged.length? logged.reduce((s,d)=>s+totals(d)[m.k],0)/logged.length : 0;
    const overDays = logged.filter(d=>totals(d)[m.k]>tg[m.k]).length;
    h += `<div class="card">
      <div class="row sp"><h2 style="margin:0">${m.n}</h2>
        <span class="pill ${avg>tg[m.k]?'bad':avg>tg[m.k]*0.8?'warn':'ok'}">avg ${fmt(avg,m.k)}${m.u}</span></div>
      <div class="tiny">${logged.length? `Over budget on ${overDays} of ${logged.length} logged days` : 'No data yet'}</div>
      <div class="bars">${days.map((d,i)=>{
        const v=vals[i], has=logsFor(d).length>0;
        return `<div class="b ${v>tg[m.k]?'over':''}" style="height:${has?Math.max(2,v/max*100):2}%;opacity:${has?1:.25}" title="${prettyDate(d)}: ${fmt(v,m.k)}${m.u}"></div>`;
      }).join('')}</div>
      <div class="blabs">${days.map((d,i)=>`<span>${i%3===0? d.slice(8):''}</span>`).join('')}</div>
      <div class="tiny" style="margin-top:6px">Target ${tg[m.k]}${m.u}/day · last 14 days</div>
    </div>`;
  }

  // biggest contributors over 14 days
  const recent = S.logs.filter(l=>days.includes(l.date));
  if(recent.length){
    const by={};
    for(const l of recent){ const k=l.name; by[k]=by[k]||{n:k,c:0,sat:0,na:0,pur:0,sug:0,kcal:0};
      by[k].c++; for(const m of ['sat','na','pur','sug','kcal']) by[k][m]+=(l[m]||0)*(l.qty||1); }
    const arr=Object.values(by);
    h += `<div class="card"><h2>What's using your budget</h2>
      <p class="tiny" style="margin:-4px 0 10px">Totals across the last 14 days</p>`;
    for(const m of ['sat','na','pur','sug']){
      const met=METRICS.find(x=>x.k===m);
      const top=arr.slice().sort((a,b)=>b[m]-a[m]).slice(0,3).filter(x=>x[m]>0);
      if(!top.length) continue;
      h+=`<h3 style="margin-top:14px">${met.n}</h3>`;
      h+=top.map(x=>`<div class="swaprow"><span>${x.n} <span class="tiny">×${x.c}</span></span>
        <span class="sv" style="color:var(--ink2)">${fmt(x[m],m)}${met.u}</span></div>`).join('');
    }
    h+=`</div>`;
  }
  view.innerHTML = h || `<div class="empty">Log a few meals and trends will appear here.</div>`;
}

function foodBefore(date){
  const d1=shiftKey(date,-1), d2=shiftKey(date,-2);
  const ls=[...logsFor(d2),...logsFor(d1)];
  if(!ls.length) return '';
  const pur=ls.reduce((s,l)=>s+(l.pur||0)*(l.qty||1),0);
  const top=ls.slice().sort((a,b)=>(b.pur*(b.qty||1))-(a.pur*(a.qty||1))).slice(0,2).map(l=>l.name);
  return `<small style="color:var(--ink2)">48h before: ${Math.round(pur)}mg purine${top.length?` — mostly ${top.join(', ')}`:''}</small>`;
}

/* A 1x1 pixel round-trip. Distinguishes "key wrong" from "browser blocked",
   which is the question that decides whether ILMU is usable without a server. */
async function testConn(){
  const P=prov();
  if(!activeKey()){ alert('Add a key first.'); return; }
  tab='health'; render();
  showFlash(`<div class="flash ok"><div class="fh"><span class="spin"></span> Testing ${P.name}…</div></div>`);
  const px='/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AVN//2Q==';
  try{
    const hdr={'content-type':'application/json','anthropic-version':'2023-06-01'};
    if(S.provider==='ilmu') hdr['Authorization']='Bearer '+activeKey();
    else { hdr['x-api-key']=activeKey(); hdr['anthropic-dangerous-direct-browser-access']='true'; }
    const r=await fetch(P.url,{method:'POST',headers:hdr,body:JSON.stringify({
      model:curModel(), max_tokens:16,
      messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:px}},
        {type:'text',text:'Reply with the single word: ok'}]}]})});
    const txt=await r.text();
    if(r.ok){
      showFlash(`<div class="flash ok"><div class="fh">${P.name} works</div>
        <div class="fs">Model <b>${curModel()}</b> answered. ${costKnown()?`Photos will cost about <b>${senTxt()}</b> each.`:`This provider does not publish its API rates, so the app can't show a cost per photo — check your ILMU console.`}</div></div>`);
    } else {
      let msg=txt.slice(0,160); try{ const j=JSON.parse(txt); msg=(j.error&&(j.error.message||j.error.type))||j.message||msg; }catch(e){}
      showFlash(`<div class="flash warn"><div class="fh">${P.name} refused the request (${r.status})</div>
        <div class="fs">${msg}</div>
        <div class="fa"><button onclick="openKey()">Check the key</button></div></div>`);
    }
  }catch(e){
    showFlash(`<div class="flash warn"><div class="fh">Blocked before it reached ${P.name}</div>
      <div class="fs">The request never left the browser. That usually means <b>CORS</b> — this provider doesn't allow calls straight from a web page${S.provider==='ilmu'?', which ILMU has not documented either way':''}. It needs a small server proxy, or pick a different provider above.</div>
      <div class="fa"><button onclick="S.provider='anthropic';S.model='';save();render();">Switch to Claude</button></div></div>`);
  }
}

async function readPanel(dataUrl){
  const P=prov();
  const body={ model:curModel(), max_tokens:900,
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}},
      {type:'text',text:`This is a photo of a food or drink package — probably the nutrition panel, possibly the front of pack.

Read the numbers off it. Report values **per one serving as the pack defines a serving**. If the panel is per 100g/100ml and also states a serving size, convert to one serving and say which you used. If you can see the ingredients list, use it to judge sugar type.

Definitions that matter here:
- **"sug" = FREE SUGARS**: added sugars, honey, syrup, fruit juice. For a packaged product almost all listed sugar is free sugar, unless it's plain milk or plain yoghurt (lactose is NOT free sugar) or unsweetened dried/whole fruit.
- **"fru" = grams of FRUCTOSE.** Use the ingredients: sucrose is 50% fructose by mass; high-fructose corn syrup roughly 55%; glucose, dextrose, maltodextrin and glucose syrup are 0% fructose; honey ~40%; fruit juice concentrate is high. If the ingredients list glucose/dextrose/maltodextrin only, fru is 0. Estimate and say how in the note.
- **"pur" = purine mg.** Nearly always 0 for a drink, a gel or a confection. Only meat, fish, offal and yeast extract carry meaningful purine.

If the image is not a food package at all, reply {"notLabel":true}.

Reply with ONLY JSON:
{"name":"product name","brand":"brand if visible","serving":"e.g. 1 sachet 40g / 500ml bottle","kcal":number,"sat":number,"na":number,"sug":number,"fru":number,"pur":number,"note":"one short sentence — how you worked out the fructose, and anything worth knowing"}`}
    ]}]};
  const hdr={'content-type':'application/json','anthropic-version':'2023-06-01'};
  if(S.provider==='ilmu') hdr['Authorization']='Bearer '+activeKey();
  else { hdr['x-api-key']=activeKey(); hdr['anthropic-dangerous-direct-browser-access']='true'; }
  const r=await fetch(P.url,{method:'POST',headers:hdr,body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text();
    if(r.status===401) throw aiErr('key','Key rejected','Check it in Settings.');
    throw aiErr('other','Request failed ('+r.status+')',String(t).slice(0,120)); }
  const j=await r.json();
  const o=parseLoose((j.content||[]).map(c=>c.text||'').join(''));
  if(!o) throw aiErr('noparse','Couldn\'t read the reply','Try a straighter, better-lit photo of the panel.');
  if(o.notLabel) throw aiErr('notlabel','That doesn\'t look like a package','Photograph the nutrition panel on the back.');
  return o;
}
/* Which days actually have anything in them, and how that day went. */
function dayStatus(k){
  const ls=logsFor(k), ws=worksFor(k);
  const other = ws.length || (S.weights||[]).some(w=>w.date===k)
             || (S.flares||[]).some(f=>f.date===k) || (S.headaches||[]).some(x=>x.date===k);
  if(!ls.length) return other? 'other' : null;
  const sat=totals(k).sat, tgt=S.targets.sat;
  return sat>tgt ? 'over' : sat>=tgt*0.8 ? 'near' : 'ok';
}

function openCal(shift){

  if(shift){ base.setMonth(base.getMonth()+shift); }
  calMonth = new Date(base.getFullYear(), base.getMonth(), 1).getTime();
  const first=new Date(calMonth), y=first.getFullYear(), mo=first.getMonth();
  const days=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7;                       // Monday-first
  const today=todayKey();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="cd empty"></span>';
  for(let d=1; d<=days; d++){

  if(hint) hint.innerHTML = sug

      qty:1,meal:(out.meal&&MEAL_ORDER.includes(out.meal))?out.meal:meal,items:out.items||[],hasPhoto:false,auto:true,

      sug:+(+out.sug).toFixed(1),pur:Math.round(out.pur),fru:+(+out.fru||0).toFixed(1),mismatch:!!out.reconciled,said:txt});

/* Same model, no image. */
async function identifyText(text){
  const P=prov();
  const body={ model:curModel(), max_tokens:1500,
    messages:[{role:'user',content:`Work out the nutrition for what this person ate. There is no photo — go on the description alone.

They wrote: "${text}"

They are Malaysian-Chinese, in Kuala Lumpur. Malaysian brands and portions apply — a bottle of 100 Plus is 500ml unless they say otherwise, a "glass" of milk is about 250ml.
${recentMealContext()}
Break it into components. For each give "unit" (what ONE unit is), "present" (how many they had in front of them), "eaten" (how many they consumed — same as present unless they say otherwise), and kcal/sat/na/sug/fru/pur **PER SINGLE UNIT**. Name components in the SINGULAR. At most 8 components, short strings.

**"sug" is FREE SUGARS only (WHO): added sugars, honey, syrup, juice. Whole fruit and milk lactose contribute ZERO free sugars.**
**"fru" is grams of FRUCTOSE from all sources including fruit** (sucrose counts half). They have gout — fructose is what raises urate.

Purine guide, mg per 100g: pork/beef 75–120 · chicken breast 141 · pork liver 285 · squid 170 · prawn 195 · sardine 210 · tofu 20–31 · eggs 0 · dairy 0 · fruit and vegetables 3–70 · rice 26.
Saturated fat is what matters most to this person (LDL 5.2, coronary calcium 91).

Reply with ONLY a JSON object:
{"name":"short summary of the meal","kcal":number,"sat":number,"na":number,"sug":number,"fru":number,"pur":number,"meal":"Breakfast|Lunch|Dinner|Late snack","items":[{"name":"component","unit":"1 medium","present":number,"eaten":number,"kcal":number,"sat":number,"na":number,"sug":number,"fru":number,"pur":number}],"portionSeen":"what you assumed","note":"one short sentence on the biggest issue"}`}]};
  const hdr={'content-type':'application/json','anthropic-version':'2023-06-01'};
  if(S.provider==='ilmu') hdr['Authorization']='Bearer '+activeKey();
  else { hdr['x-api-key']=activeKey(); hdr['anthropic-dangerous-direct-browser-access']='true'; }
  const r=await fetch(P.url,{method:'POST',headers:hdr,body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text();
    if(r.status===401) throw aiErr('key','Key rejected','Check it in Settings.');
    throw aiErr('other','Request failed ('+r.status+')',String(t).slice(0,120)); }
  const j=await r.json();
  const o=parseLoose((j.content||[]).map(c=>c.text||'').join(''));
  if(!o) throw aiErr('noparse','Couldn\'t read the reply','Try rewording it.');
  o.items=resolveItems(normItems(o.items));
  return o;
}

   PHOTO + AI
   ============================================================ */
function flashEl(){ return document.getElementById('flash'); }
function showFlash(html){ const el=flashEl(); if(el) el.innerHTML=html; }

function onPhoto(input, fromLibrary){
  const f=input.files&&input.files[0]; if(!f) return;
  /* A picked photo is usually an earlier meal, so trust its timestamp for both
     the date and the meal slot rather than assuming "now". */
  shotTs = (fromLibrary && f.lastModified) ? f.lastModified : Date.now();
  shotDate = todayKey(new Date(shotTs));
  shotFromLibrary = !!fromLibrary;
  const r=new FileReader();
  r.onload=async e=>{
    const full=e.target.result;
    pendingThumb=await shrink(full,160,0.7);
    pendingFull =await shrinkToBudget(full, S.photoKB||100, 900);
    pendingPhoto=pendingThumb;
    input.value='';
    if(!activeKey()){
      pendingPhoto=null;
      showFlash(`<div class="flash warn">
        <div class="fh">The camera isn't connected yet</div>
        <div class="fs">Add an Anthropic API key and photos will fill themselves in. Takes about two minutes.</div>
        <div class="fa"><button onclick="openKey()">Set it up</button>
          <button onclick="openCustom({note:'Enter it by hand.'})">Type this one in</button></div></div>`);
      return;
    }
    showFlash(`<div class="flash ok"><div class="fr">
      <img class="fimg" src="${pendingPhoto}" alt="Your photo">
      <div style="flex:1;min-width:0"><div class="fh"><span class="spin"></span> Reading the photo…</div>
      <div class="fs">Identifying the dish and estimating the portion.</div></div></div></div>`);
    try{
      const big=await shrink(full,900);
      const out=await identify(big);

      if(out.notFood){
        const shown=pendingThumb;
        clearPending();                       // discarded — never written to storage
        showFlash(`<div class="flash warn">
          <div class="fr"><img class="fimg dim" src="${shown}" alt="Discarded photo"><div style="flex:1;min-width:0">
          <div class="fh">No food in that photo</div>
          <div class="fs">${out.saw? 'It saw: '+out.saw+'.' : ''} Nothing logged, and this photo was <b>not</b> saved.</div>
          </div></div>
          <div class="fa"><button onclick="document.getElementById('cam').click()">Try again</button>
            <button onclick="openCustom({note:'Enter it by hand.'})">Type it in</button></div></div>`);
        return;
      }

      const meal = out.meal && MEAL_ORDER.includes(out.meal) ? out.meal : mealOf(shotTs);
      const logDate = shotFromLibrary ? shotDate : cur;
      const mt = safeMatch(out);              // only ever for a single-dish meal
      if(!mt) reconcile(out);                 // components are the source of truth
      if(mt){
        const d=mt.dish;
        out.kcal=d.kcal; out.sat=d.sat; out.na=d.na; out.sug=d.sug; out.pur=d.pur; out.fru=d.fru||0;
        out.matched=d.n; out.grade=d.grade;
        out.portionSeen=(out.portionSeen? out.portionSeen+' · ' : '')+'using our measured figures for '+d.n+' ('+d.srv+')';
      }
      S.shots=(S.shots||0)+1; S.spendUsd=(S.spendUsd||0)+modelCost();
      learnFrom(out);

      // Confident → log it and get out of the way. Unsure → ask.
      if(out.confidence==='high'){
        const entry={id:uid(),date:logDate,ts:shotTs,dishId:null,name:out.name||'Meal',qty:1,meal,auto:true,
          seen:out.portionSeen||'', matched:out.matched||'', items:out.items||[], hasPhoto:!!pendingThumb,
          base:{kcal:out.kcal,sat:out.sat,na:out.na,sug:out.sug,pur:out.pur},
          kcal:out.kcal,sat:out.sat,na:out.na,sug:out.sug,pur:out.pur,fru:out.fru||0};
        await commitPhoto(entry.id);
        S.logs.push(entry); save(); render();
        showFlash(flashFor(entry.id));
        return;
      } else {

        showFlash('');
        openCustom({...out, meal,
          note:`<b>Not fully sure about this one.</b> ${out.why||'Check the numbers before saving.'}`});
      }
    }catch(err){
      pendingPhoto=null;                      // nothing legit to keep
      const needsKey = err.kind==='key' || err.kind==='billing';
      showFlash(`<div class="flash warn">
        <div class="fh">${err.title||'Something went wrong'}</div>
        <div class="fs">${err.fix||String(err.message||err).slice(0,160)}</div>
        <div class="fa">
          ${needsKey?`<button onclick="openKey()">Open settings</button>`:''}
          <button onclick="document.getElementById('cam').click()">Try another photo</button>
          <button onclick="pendingPhoto=null;openCustom({note:'Enter it by hand.'})">Type it in</button>
        </div></div>`);
    }
  };
  r.readAsDataURL(f);
}

function shrink(dataUrl,max,quality){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.max(1,img.width*s|0); c.height=Math.max(1,img.height*s|0);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',quality==null?0.75:quality));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

/* Encode down to a byte budget instead of a fixed pixel size — a plain bowl
   of fruit can stay large, a busy hawker plate gets compressed harder. */
async function shrinkToBudget(dataUrl, budgetKB, startPx){
  const budget=budgetKB*1024*1.37;             // base64 inflates ~37%
  let px=startPx||900, q=0.82, out=await shrink(dataUrl,px,q);
  let guard=0;
  while(out.length>budget && guard++<8){
    if(q>0.55) q-=0.08; else px=Math.round(px*0.82);
    out=await shrink(dataUrl,px,q);
  }
  return out;
}

**If the plate holds several distinct things** — rice plus two dishes, a mixed economy-rice plate, leftovers combined — break it down. Put each component in "items". For each one give:
- "unit": what ONE unit is ("1 mini roll", "500ml bottle", "1 medium")
- "present": how many units are visible in the photo
- "eaten": how many they actually ate — **only if they told you**; otherwise repeat "present"
- kcal/sat/na/sug/fru/pur **PER SINGLE UNIT**, not for the whole quantity

**"fru" means grams of FRUCTOSE**, from every source including whole fruit — sucrose is half fructose, so count half of any sucrose. This person has gout and fructose is the sugar that raises uric acid, so report it even when it comes from fruit.

**If the photo contains no identifiable food or drink** — it's a person, a wall, a screen, a blur, anything else — do NOT guess and do NOT explain in prose. Reply with exactly this shape:

/* The model names the dish; our own measured Malaysian data supplies the
   numbers whenever it recognises one. Better than a guess, and it means the
   dish table no longer has to be sent with every photo. */
/* Malaysian romanisation is wildly inconsistent — kuey / kway / koay / kueh
   teow all name the same dish. Fold the common variants, then allow a small
   edit distance on top so one stray letter doesn't lose the match. */
const SPELL=[[/k[uwoa]{1,2}[ae]?y?\s*teow/g,'kwayteow'],[/kue?h/g,'kuih'],[/mee|mi\b/g,'mee'],
  [/bee\s*hoon|bihun|mee\s*hoon/g,'beehoon'],[/char\s*siu|char\s*siew|chashu/g,'charsiew'],
  [/siu\s*yuk|siew\s*yok|roast\s*pork\s*belly/g,'siewyok'],[/wan\s*ton|wantan|wonton/g,'wantan'],
  [/nasi\s*lemak/g,'nasilemak'],[/kon\s*lo[uh]?|dry\s*toss/g,'dry'],[/tonkotsu|ton\s*kotsu/g,'tonkotsu']];
/* Leftovers are common — if last night's stew shows up at breakfast, the model
   should recognise it rather than start from scratch. Cheap: names only. */
function recentMealContext(){
  const cutoff=Date.now()-3*864e5;
  const seen=[], names=new Set();
  for(const l of S.logs.slice().sort((a,b)=>b.ts-a.ts)){
    if(l.ts<cutoff) break;
    if(names.has(l.name)) continue;
    names.add(l.name);
    const hrs=Math.round((Date.now()-l.ts)/36e5);
    seen.push(`${l.name} (${hrs<24?hrs+'h ago':Math.round(hrs/24)+'d ago'})`);
    if(seen.length>=8) break;
  }
  if(!seen.length) return '';
  return `\nRecently eaten, most recent first — they often finish leftovers, so if the photo resembles one of these it probably IS that dish:\n${seen.join(' · ')}\n`;
}
/* Anything the AI works out gets remembered, per unit, so the same food is
   free next time. Components are learned individually — "2 bananas" teaches
   the app what ONE banana is. */
/* A component now stores what ONE unit is, how many were in front of you, and
   how many you ate. Totals are always computed from those — never stored
   independently — so a total can no longer contradict its own breakdown. */
function normItems(raw){
  if(!Array.isArray(raw)) return [];
  return raw.map(i=>{
    const present=Math.max(0.01, +i.present || +i.qty || 1);
    const eaten=(i.eaten==null||i.eaten==='') ? present : Math.max(0,+i.eaten);
    return {name:String(i.name||'').trim(), unit:i.unit||'1 serving', present, eaten,
      per:{kcal:+i.kcal||0, sat:+i.sat||0, na:+i.na||0, sug:+i.sug||0, pur:+i.pur||0, fru:+i.fru||0}};
  }).filter(i=>i.name);
}
function itemsTotal(items,useField){
  const f=useField||'eaten', t={kcal:0,sat:0,na:0,sug:0,pur:0,fru:0};
  for(const i of items||[]) for(const k in t) t[k]+=(i.per[k]||0)*(+i[f]||0);
  return t;
}
function applyItems(e){
  if(!e.items||!e.items.length) return e;
  const t=itemsTotal(e.items);
  e.kcal=Math.round(t.kcal); e.sat=+t.sat.toFixed(1); e.na=Math.round(t.na);
  e.sug=+t.sug.toFixed(1); e.pur=Math.round(t.pur); e.fru=+t.fru.toFixed(1);
  e.base={kcal:e.kcal,sat:e.sat,na:e.na,sug:e.sug,pur:e.pur,fru:e.fru}; e.frac=1;

function learnItem(name, qty, vals, unit){
  const n=(name||'').trim(); if(!n || n.length<2) return;

             sug:(+vals.sug||0)/q, pur:(+vals.pur||0)/q, fru:(+vals.fru||0)/q};
  if(!per.kcal && !per.sat && !per.na) return;
  const key=normalise(n);
  let e=S.learned.find(x=>normalise(x.n)===key);
  if(e){                                  // average towards the newer estimate
    for(const k of ['kcal','sat','na','sug','pur','fru']) e[k]=+(((e[k]*e.uses)+per[k])/(e.uses+1)).toFixed(2);
    e.uses++; e.ts=Date.now(); if(unit&&!e.srv) e.srv=unit;
  } else {
    S.learned.push({id:'L'+uid(), n:n, srv:unit||'1 serving', uses:1, ts:Date.now(),
      kcal:Math.round(per.kcal), sat:+per.sat.toFixed(1), na:Math.round(per.na),
      sug:+per.sug.toFixed(1), pur:Math.round(per.pur), fru:+(per.fru||0).toFixed(1), grade:'AI', g:'learned'});

/* If the model's headline total disagrees with its own component list, trust
   the components — they're individually reasoned, the total is arithmetic it
   did in its head. */
function reconcile(out){
  if(!out || !out.items || !out.items.length) return out;
  const t=itemsTotal(out.items);
  if(!t.kcal) return out;
  const stated=+out.kcal||0;
  if(Math.abs(t.kcal-stated)/Math.max(t.kcal,1) > 0.1) out.reconciled=Math.round(stated);
  out.kcal=Math.round(t.kcal); out.sat=+t.sat.toFixed(1); out.na=Math.round(t.na);
  out.sug=+t.sug.toFixed(1); out.pur=Math.round(t.pur); out.fru=+t.fru.toFixed(1);
  return out;
}
/* For each component, prefer a value you already have over a fresh guess.
   Built-in measured data first, then your own saved foods, then the AI's
   estimate — and say which, per component. Reusing a saved value also stops
   the same food drifting a little every time it's re-estimated. */
function resolveItems(items){
  return (items||[]).map(i=>{
    const m=matchDish(i.name);
    if(m && m.score>=75){
      const d=m.dish;
      return {...i, name:d.n, unit:d.srv||i.unit,
        per:{kcal:d.kcal||0, sat:d.sat||0, na:d.na||0, sug:d.sug||0, pur:d.pur||0, fru:d.fru||0},
        src:(d.g==='learned'?'saved':'measured'), aiPer:i.per};
    }
    return {...i, src:'new'};
  });
}
function srcSummary(items){
  if(!items||!items.length) return '';
  const n={saved:0,measured:0,new:0};
  for(const i of items) n[i.src||'new']++;
  const bits=[];
  if(n.measured) bits.push(`${n.measured} from measured data`);
  if(n.saved) bits.push(`${n.saved} from your saved foods`);
  if(n.new) bits.push(`${n.new} new — added to your list`);
  return bits.join(' · ');
}
function learnFrom(out){
  if(out.items && out.items.length){
    for(const it of out.items) if(it.src==='new') learnItem(it.name, 1, it.per, it.unit);
    if(out.items.length===1) return;
  } else if(out.name){ learnItem(out.name, 1, out); }
}
function allFoods(){ return DB.concat(S.learned||[]); }

/* Free-text parsing: "2 bottles of 100 Plus, 2 bananas and a glass of milk" */
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,half:0.5};
function parseParts(t){
  return String(t||'').split(/\n|,|;|\band\b|\+/i).map(s=>s.trim().replace(/^(?:with|plus)\s+/i,'')).filter(s=>s.length>1);
}
function parseQty(s){
  let m=s.match(/^(\d+(?:\.\d+)?)\s*(?:x\s*)?/);
  if(m) return {qty:+m[1], rest:s.slice(m[0].length).trim()};
  m=s.match(/^([a-z]+)\s+/i);
  if(m && NUMW[m[1].toLowerCase()]!=null) return {qty:NUMW[m[1].toLowerCase()], rest:s.slice(m[0].length).trim()};
  return {qty:1, rest:s};
}
function lookupLocal(part){
  const {qty,rest}=parseQty(part);
  const cleaned=rest.replace(/^(?:bottles?|glass(?:es)?|cups?|pieces?|slices?|bowls?|plates?|packs?)\s+of\s+/i,'')
                    .replace(/^(?:bottles?|glass(?:es)?|cups?|pieces?|slices?|bowls?|plates?)\s+/i,'');
  const m=matchDish(cleaned) || matchDish(rest);
  return m? {item:m.dish, qty, score:m.score, label:rest} : null;
}
function normalise(s){
  let t=(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  for(const [re,to] of SPELL) t=t.replace(re,to);
  return t.replace(/\s+/g,' ').trim();
}
function editDist(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function wordHit(w,dw){
  return dw.some(x=> x===w || x.startsWith(w) || w.startsWith(x) ||
    editDist(x,w) <= (Math.max(x.length,w.length)>5 ? 2 : 1));
}
function matchDish(name){
  const n=normalise(name); if(n.length<3) return null;
  const words=n.split(' ').filter(w=>w.length>2);
  let best=null,bestScore=0;
  for(const d of allFoods()){
    const dn=normalise(d.n);
    let score=0;
    if(dn===n) score=100;
    else if(dn.includes(n)||n.includes(dn)) score=70;
    else { const dw=dn.split(' ');
      const hits=words.filter(w=>wordHit(w,dw)).length;
      score=hits? (hits/Math.max(words.length,dw.length))*60 : 0; }
    if(score>bestScore){ bestScore=score; best=d; }
  }
  return bestScore>=50? {dish:best,score:Math.round(bestScore)} : null;
}
/* Models sometimes wrap JSON in fences, prepend a sentence, or get cut off
   mid-object. Recover from all three rather than throwing the whole reply away. */
function balancedSlice(t){
  let depth=0, inStr=false, esc=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='{'||c==='[') depth++;
    else if(c==='}'||c===']'){ depth--; if(depth===0) return t.slice(0,i+1); }
  }
  return null;
}
function repairTruncated(t){
  const stack=[]; let inStr=false, esc=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='{'||c==='[') stack.push(c==='{'?'}':']');
    else if(c==='}'||c===']') stack.pop();
  }
  let out=t;
  if(inStr) out+='"';                                    // close a dangling string
  out=out.replace(/,\s*$/,'');                            // trailing comma
  out=out.replace(/,\s*"[^"]*"\s*:\s*$/,'');             // half-written key
  out=out.replace(/:\s*$/,':null');                       // key with no value
  while(stack.length) out+=stack.pop();
  return out;
}
function parseLoose(txt){
  if(!txt) return null;
  let t=String(txt).trim()
    .replace(/^[^{]*?```(?:json)?\s*/i,'')                 // leading prose + fence
    .replace(/```[\s\S]*$/,'');                           // trailing fence
  const i=t.indexOf('{'); if(i<0) return null;
  t=t.slice(i);
  const bal=balancedSlice(t);
  if(bal){ try{ return JSON.parse(bal); }catch(e){} }
  try{ return JSON.parse(repairTruncated(t)); }catch(e){}
  return null;
}
/* Substituting our measured data is only valid when the photo is ONE dish and
   the name really is that dish. A plate of several things can never be
   described by a single saved food — that mistake wiped out whole meals. */
function safeMatch(out){
  if(out.items && out.items.length>1) return null;
  const mt=matchDish(out.name);
  if(!mt || mt.score<85) return null;
  const a=normalise(out.name), b=normalise(mt.dish.n);
  const aw=a.split(' ').filter(w=>w.length>2), bw=b.split(' ').filter(w=>w.length>2);
  if(!aw.length||!bw.length) return null;
  const covered=aw.filter(w=>bw.some(x=>wordHit(w,[x]))).length/aw.length;
  return covered>=0.7 ? mt : null;          // the saved food must cover most of the name
}
function aiErr(kind,title,fix){ const e=new Error(title); e.kind=kind; e.title=title; e.fix=fix; return e; }

/* ============================================================

/* Vision providers. ILMU exposes an Anthropic-compatible endpoint, so the

    models:[

    keyPrefix:'sk-',
    note:'Data stays in Malaysia and is never used for training.',
    models:[
      /* YTL AI Labs does not publish API rates — ytlailabs.com says

      {id:'ilmu-vision-v1.3', n:'ILMU Vision 1.3 — cheapest', usd:null},
      {id:'ilmu-v3.1',        n:'ILMU 3.1 — flagship',        usd:null}
    ]}
};
function prov(){ return PROVIDERS[S.provider||'anthropic']; }
function curModel(){ const p=prov(); return S.model && p.models.some(m=>m.id===S.model) ? S.model : p.models[0].id; }
function modelCost(){ const p=prov(); const m=p.models.find(x=>x.id===curModel()); return (m&&m.usd!=null)?m.usd:0; }
function costKnown(){ const p=prov(); const m=p.models.find(x=>x.id===curModel()); return !!(m&&m.usd!=null); }
/* "1.1 sen" when we have a published rate, an honest shrug when we don't. */
function senTxt(){ return costKnown() ? `${(modelCost()*470).toFixed(1)} sen` : 'an unpublished rate'; }
function monthTxt(){ return costKnown() ? `RM ${(modelCost()*4.7*3*30).toFixed(2)} a month` : 'a rate ILMU has not published'; }

const GH='https://api.github.com';
const SHARD_MAX=800000;
let backupTimer=null, backupBusy=false;

function ghHeaders(){ return {'Authorization':'Bearer '+S.ghToken,
  'Accept':'application/vnd.github+json','Content-Type':'application/json'}; }

async function ghErr(r){
  let t=''; try{ t=(await r.json()).message||''; }catch(e){}
  if(r.status===401) return 'Token rejected — check it has the "gist" scope and hasn\'t expired.';
  if(r.status===403) return 'Forbidden — the token is missing the "gist" scope.';
  if(r.status===404) return 'Backup not found. It may have been deleted — disconnect and reconnect.';
  if(r.status===422) return 'GitHub refused the data ('+(t||'too large?')+').';
  return 'GitHub error '+r.status+(t?' — '+t:'');
}

function splitState(){
  const data={v:2, logs:S.logs.map(l=>{const c={...l}; delete c.photo; return c;}),
              flares:S.flares, weights:S.weights, headaches:S.headaches, workouts:S.workouts||[],
              targets:S.targets, recent:S.recent, learned:S.learned||[], savedAt:Date.now()};
  return {data};                               // apiKey and ghToken never leave the phone
}
async function photosForBackup(){
  const all=await IDB.entries(); const out={};
  const days=S.backupPhotoDays||0;             // 0 = everything
  const cut=days? Date.now()-days*864e5 : 0;
  for(const id of Object.keys(all)){
    const l=S.logs.find(x=>x.id===id);
    if(cut && l && new Date(l.date).getTime()<cut) continue;
    out[id]=all[id].full||all[id].thumb;
  }
  return out;
}
function shardPhotos(photos){
  const shards=[]; let cur={}, size=0;
  for(const k of Object.keys(photos)){
    const v=photos[k];
    if(size && size+v.length>SHARD_MAX){ shards.push(cur); cur={}; size=0; }
    cur[k]=v; size+=v.length;
  }
  if(Object.keys(cur).length) shards.push(cur);
  return shards;
}

async function ensureGist(){
  if(S.gistId) return S.gistId;
  const r=await fetch(GH+'/gists',{method:'POST',headers:ghHeaders(),body:JSON.stringify({
    description:'Food log backup (private) — created by the eating-plan app',
    public:false, files:{'foodlog-data.json':{content:'{}'}}
  })});
  if(!r.ok) throw new Error(await ghErr(r));
  const j=await r.json();
  S.gistId=j.id; S.gistUrl=j.html_url; saveLocal();
  return j.id;
}

function scheduleBackup(){
  clearTimeout(backupTimer);

async function pushBackup(withPhotos, manual){
  if(!S.ghToken){ if(manual) alert('Connect GitHub first.'); return false; }
  if(backupBusy) return false;
  backupBusy=true; if(manual) render();
  try{
    const id=await ensureGist();
    const {data}=splitState();
    const files={'foodlog-data.json':{content:JSON.stringify(data)}};

    if(withPhotos){
      const photos=await photosForBackup();
      const shards=shardPhotos(photos);
      shards.forEach((s,i)=>{ files['foodlog-photos-'+String(i+1).padStart(2,'0')+'.json']={content:JSON.stringify(s)}; });
      // remove shards that are no longer needed
      for(let i=shards.length; i<(S.photoShards||0); i++)
        files['foodlog-photos-'+String(i+1).padStart(2,'0')+'.json']=null;
      S.photoShards=shards.length;
    }
    const r=await fetch(GH+'/gists/'+id,{method:'PATCH',headers:ghHeaders(),body:JSON.stringify({files})});
    if(!r.ok) throw new Error(await ghErr(r));
    S.lastBackup=Date.now(); if(withPhotos) S.lastPhotoBackup=Date.now();
    S.backupErr=''; saveLocal();
    if(manual) alert('Backed up.');
    return true;
  }catch(e){
    S.backupErr=String(e.message||e).slice(0,160); saveLocal();
    if(manual) alert('Backup failed — '+S.backupErr);
    return false;
  }finally{ backupBusy=false; if(tab==='health') render(); }
}

async function restoreBackup(){
  if(!S.ghToken||!S.gistId){ alert('Nothing connected to restore from.'); return; }
  if(!confirm('Replace everything on this phone with the last backup? Anything logged since then will be lost.')) return;
  try{
    const r=await fetch(GH+'/gists/'+S.gistId,{headers:ghHeaders()});
    if(!r.ok) throw new Error(await ghErr(r));
    const j=await r.json();
    const df=j.files['foodlog-data.json'];
    if(!df) throw new Error('That backup has no data file.');
    const data=JSON.parse(df.content||'{}');
    const photos={};
    for(const name of Object.keys(j.files)){
      if(!/^foodlog-photos-\d+\.json$/.test(name)) continue;
      const f=j.files[name];
      const txt = f.truncated && f.raw_url ? await (await fetch(f.raw_url)).text() : (f.content||'{}');
      Object.assign(photos, JSON.parse(txt||'{}'));
    }
    for(const pid of Object.keys(photos)){
      await IDB.put(pid,{thumb:photos[pid], full:photos[pid], ts:Date.now()});
      THUMBS[pid]=photos[pid];
    }
    const keepTok=S.ghToken, keepKey=S.apiKey, keepId=S.gistId, keepUrl=S.gistUrl;
    S=Object.assign(blank(), {
      logs:(data.logs||[]),
      flares:data.flares||[], weights:data.weights||[], headaches:data.headaches||[], workouts:data.workouts||[],
      targets:Object.assign({...DEFAULT_TARGETS}, data.targets||{}), recent:data.recent||[], learned:data.learned||[],
      ghToken:keepTok, apiKey:keepKey, gistId:keepId, gistUrl:keepUrl, lastBackup:Date.now()
    });
    saveLocal(); render();
    alert(`Restored ${S.logs.length} meals, ${Object.keys(photos).length} photos, ${S.flares.length} flares.`);
  }catch(e){ alert('Restore failed — '+String(e.message||e).slice(0,160)); }
}

function agoTxt(ts){

  if(s<60) return 'just now';

  if(s<86400) return Math.round(s/3600)+' h ago';

}

},60); };
document.getElementById('prev').onclick=()=>{ cur=shiftKey(cur,-1); render(); };
document.getElementById('next').onclick=()=>{ if(cur<todayKey()){ cur=shiftKey(cur,1); render(); } };
render();

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden' && S.ghToken){
    if(Date.now()-(S.lastPhotoBackup||0) > 6*3600*1000) pushBackup(true);
    else pushBackup(false);
  }
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
